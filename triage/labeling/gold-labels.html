 0.73, "mod_probs": {"node_lifecycle": 0.74, "late_lazy": 0.15, "reference": 0.05}, "severity": 0.9, "nouls": {"has_reproduction": 0.06, "proposes_concrete_fix": 0.07, "thread_already_resolved": 0.02, "external_cause": 0.08, "maintainer_declined": 0.04, "blocked_on_info": 0.04, "asks_to_change_documented_behavior": 0.15, "reporter_is_frustrated_or_blocked": 0.08}}}, {"number": 2080, "title": "Use getTime() to check for Date equality", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2080", "created": "2023-09-11", "updated": "2023-09-19", "labels": ["breaking change", "level: intermediate"], "author": "davetapley", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\nA new snapshot is created for the same `Date.getTime()` but different `Date` object.\r\n\r\n**Sandbox link or minimal reproduction code**\r\n\r\nhttps://github.com/JEFuller/mobx-state-tree/blob/7d8c20321959e51a0607b4a524f407b400a7a92b/packages/mobx-state-tree/__tests__/core/date.test.ts#L47-L57\r\n\r\n**Describe the expected behavior**\r\n\r\nMobX-State-Tree is smart enough to know two `Date` are the same because:\r\n\r\n1. This is almost certainly what the user wants, and:\r\n\r\n3. The value in the JSONPatch is stored as the `getTime()` anyway\r\n    (so, you can end up with multiple identical `replace` patches, which doesn't make sense semantically).\r\n\r\n**Describe the observed behavior**\r\n\r\nMobX-State-Tree creates a new snapshot every time.", "comments": [{"author": "davetapley", "assoc": "CONTRIBUTOR", "date": "2023-09-11", "body": "I have a test repro, and I'm happy to do a PR to fix, but could do with a pointer where in code to look \ud83d\ude01"}, {"author": "davetapley", "assoc": "CONTRIBUTOR", "date": "2023-09-12", "body": "I did some more digging and I'm _guessing_ this would (ideally) have to be fixed upstream in MobX?\r\n- https://github.com/mobxjs/mobx/issues/3757"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[2 comments omitted]"}, {"author": "davetapley", "assoc": "CONTRIBUTOR", "date": "2023-09-19", "body": "Thanks for the reply, obviously happy to defer to maintainers, but r.e. _JS behavior vs philosophical question_ I'll say this \u2b07\ufe0f  and then let it go \ud83d\ude01 \r\n\r\nMST (and libraries in general) exist because they make solving a problem with a \r\nlanguage simpler, so I'm always a little ambivalent to this kind of 'appeal to purity'.\r\n\r\nFrom my perspective as a user of MST:\r\n\r\n1. The existing behavior is already inconsistent (i.e. snapshot or not depends whether assigning a primitive or not).\r\n1. I honestly can't think of a case where assignment causing a consecutive identical snapshots would be the expected or useful behavior (unless I already know how things work under the hood \ud83d\ude09).\r\n\r\n---\r\n\r\nGlad you mentioned arrays, because I'd extend my proposal to those as well.\r\n\r\nCase in point:\r\n> If we have an array: [1, 2, 3] and replace it in MST with a new array with the same contents, [1, 2, 3], MST wi \u2026"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2023-09-19", "body": "@davetapley - whoa! Excellent detail here, and I was totally wrong about the array replacement. Thank you for the correction. I haven't had a chance to run your tests, but I [wrote up a code sandbox here](https://codesandbox.io/s/relaxed-rgb-gwz476?file=/src/index.ts). I make this mistake all the time, and to be honest, a lot of the times when I write MST code, I'm doing a little guess-and-check, so I just had the totally wrong mental model on this. I appreciate your pushback.\r\n\r\nI also apologize if I came off as putting purity over practicality, I legitimately thought our existing behavior was more consistent than it seems to be. I care a little less about the purity, and more about the consistency. But if there's inconsistency already, then I'm less concerned on that front.\r\n\r\nAll that to say, I'm somewhat convinced that we might want to consider making this change to how the date equa \u2026"}, {"author": "davetapley", "assoc": "CONTRIBUTOR", "date": "2023-09-19", "body": "@coolsoftwaretyler that all sounds good \u2705 \r\n\r\nAs an aside (and for future record), have you seen / used `comparer.structural` https://github.com/mobxjs/mobx/issues/3757#issuecomment-1720829929?\r\n\r\nIt looks like a MobX feature which gets closer to what I'm proposing, but [no mention of it in MST](https://github.com/search?q=repo%3Amobxjs%2Fmobx-state-tree%20structural&type=code)."}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2023-09-19", "body": "Hey @davetapley - I can't say I have! Seems neat. I don't drop down outside of the MST API too often myself, but I'm hoping to get into the internals more over the coming months."}], "jev": {"disposition": "breaking_change_proposal", "disp_conf": 0.95, "disp_probs": {"breaking_change_proposal": 0.96, "runtime_bug": 0.04}, "module": "mobx_interop", "mod_conf": 0.44, "mod_probs": {"mobx_interop": 0.47, "refinement_custom_enum": 0.37, "patches_snapshots": 0.13}, "severity": 1.4, "nouls": {"has_reproduction": 0.96, "proposes_concrete_fix": 0.28, "thread_already_resolved": 0.59, "external_cause": 0.67, "maintainer_declined": 0.27, "blocked_on_info": 0.06, "asks_to_change_documented_behavior": 0.7, "reporter_is_frustrated_or_blocked": 0.8}}}, {"number": 2208, "title": "Model Creation/Instantiation Allows Duplicate names (except for properties)", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2208", "created": "2024-08-16", "updated": "2024-09-27", "labels": ["enhancement", "help/PR welcome", "level: easy", "hacktoberfest"], "author": "coolsoftwaretyler", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n-   [x] I've checked documentation and searched for existing issues [and discussions](https://github.com/mobxjs/mobx-state-tree/discussions)\r\n-   [x] I've made sure my project is based on the latest MST version\r\n-   [x] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction.\r\n\r\n**Sandbox link or minimal reproduction code**\r\n\r\nhttps://codesandbox.io/p/sandbox/duplicate-views-no-error-92z9c7\r\n\r\n**Describe the expected behavior**\r\n\r\nIn this code: \r\n\r\n```ts\r\nimport { getSnapshot, t } from \"mobx-state-tree\";\r\n\r\n(async function () {\r\n  const Person = t\r\n    .model(\"Person\", {\r\n      name: t.string,\r\n    })\r\n    .actions((self) => ({\r\n      anAction() {\r\n        self.name = \"Changed\";\r\n      },\r\n    }))\r\n    .views((self) => ({\r\n      something() {\r\n        return \"something\";\r\n      },\r\n      something() {\r\n        return \"something else\";\r\n      },\r\n      anAction() {\r\n        return \"Ooh that was weird\";\r\n      },\r\n    }));\r\n\r\n  const you = Person.create({\r\n    name: \"your name\",\r\n  });\r\n\r\n  const snapshot = getSnapshot(you);\r\n\r\n  console.log(snapshot);\r\n\r\n  you.anAction(); // It looks like this is *not* changing the name, so the second declaration overwrites the first.\r\n  console.log(you);\r\n  console.log(you.something()); // This gets the latest declaration value, 'something else'\r\n})();\r\n```\r\n\r\nNotice that we encounter *no* runtime errors on the duplicate names. In some cases, like the duplicate view names, some editors may report a redline about the duplicate. But that does *not* seem to happen across `actions` and `views` method calls.\r\n\r\nWe noticed this in https://github.com/mobxjs/mobx-state-tree/pull/2207#pullrequestreview-2243495912, because we were moving some of the `properties` duplicate checks into the `views` and `actions` methods, and I was expecting to see *other* duplicate checks, but none exist.\r\n\r\n**What should happen?**\r\n\r\nIf a user defines a model with duplicate keys, instead of overwriting the prior keys, we should throw a helpful error that says something like \"[keyname] exists already in [views | actions | volatile]\", much like we do when users duplicate a property on the model itself.\r\n\r\n**What happens instead?**\r\n\r\nNo runtime errors, and the most recently defined property overwrites the least recently defined properties.", "comments": [{"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-08-16", "body": "@thegedge - I think we just need to make sure we don't break `types.compose`. For a trivial instance, a loud person model yells, a quiet person model whispers. I compose to a regular person and expect the second model to \"override\" the first (almost simulating a type of inheritance, I suppose):\r\n\r\n```ts\r\nimport { t } from \"mobx-state-tree\";\r\n\r\n(async function () {\r\n  const LoudPerson = t\r\n    .model(\"LoudPerson\", {\r\n      name: t.string,\r\n    })\r\n    .actions((self) => ({\r\n      sayName() {\r\n        console.log(self.name.toUpperCase());\r\n      },\r\n    }));\r\n\r\n  const QuietPerson = t\r\n    .model(\"QuietPerson\", {\r\n      name: t.string,\r\n    })\r\n    .actions((self) => ({\r\n      sayName() {\r\n        console.log(self.name.toLowerCase());\r\n      },\r\n    }));\r\n\r\n  const RegularPerson = t.compose(\"RegularPerson\", LoudPerson, QuietPerson);\r\n\r\n  const person = RegularPerson.create({ name: \"Tyler\" \u2026"}, {"author": "thegedge", "assoc": "COLLABORATOR", "date": "2024-08-16", "body": "Yeah, that should be totes doable.\r\n\r\nI guess the one case that could be problematic if X has a property with name `something` and Y has a view with the name `something` and you compose the two together. That seems kind of reasonable to do, but would \ud83d\udca5. I _think_ it would \ud83d\udca5 even before my recent changes, so if it's something we want to support, we may have some work to do!"}], "jev": {"disposition": "feature_api_neutral", "disp_conf": 0.84, "disp_probs": {"feature_api_neutral": 0.86, "breaking_change_proposal": 0.08, "runtime_bug": 0.06}, "module": "model", "mod_conf": 1, "mod_probs": {"model": 1}, "severity": 1.3, "nouls": {"has_reproduction": 0.98, "proposes_concrete_fix": 0.19, "thread_already_resolved": 0.04, "external_cause": 0.06, "maintainer_declined": 0.04, "blocked_on_info": 0.04, "asks_to_change_documented_behavior": 0.36, "reporter_is_frustrated_or_blocked": 0.08}}}, {"number": 2215, "title": "Unexpected patches for Dates with applySnapshot", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2215", "created": "2024-09-16", "updated": "2024-09-16", "labels": ["enhancement", "help/PR welcome", "level: intermediate"], "author": "thegedge", "body": "**_Bug report_**\r\n\r\n- [x] I've checked documentation and searched for existing issues [and discussions](https://github.com/mobxjs/mobx-state-tree/discussions)\r\n- [x] I've made sure my project is based on the latest MST version\r\n- [x] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction.\r\n\r\n**Sandbox link or minimal reproduction code**\r\n\r\nhttps://codesandbox.io/p/sandbox/mst-autorun-example-forked-7ds6cs?file=%2Findex.ts%3A1%2C1-35%2C1&workspaceId=84a0645a-1491-4074-88e5-f44a8818ef46\r\n\r\n**Describe the expected behavior**\r\n\r\nWhen running `applySnapshot` without changing the value for a `types.Date`, I expect no patches to be emitted.\r\n\r\n**Describe the observed behavior**\r\n\r\nPatches are emitted even though the values haven't changed.\r\n\r\n![CleanShot 2024-09-16 at 16 43 51@2x](https://github.com/user-attachments/assets/fb23be40-47c3-4140-9594-12e327ad0a69)\r\n\r\n**Other notes**\r\n\r\nI can guess at the implementation here and why the patch is being emitted: `new Date(123) != new Date(123)`.\r\n\r\nWhat I'm wondering is how far we should go to minimize the patches \ud83e\udd14 \r\n\r\nDo we close this as \"working as intended\"? If not, should we avoid emitting a patch for a `types.frozen` with the value `{ value: \"a\" }` and having a snapshot applied with the same value (but a difference instance)?", "comments": [{"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-09-16", "body": "Looks related to https://github.com/mobxjs/mobx-state-tree/issues/2080\n\nWe have that marked as a breaking change and I haven't released v7 yet so maybe we consider this and bundle it there..."}, {"author": "thegedge", "assoc": "COLLABORATOR", "date": "2024-09-16", "body": "Ah, good catch @coolsoftwaretyler. I was focused on looking for generic snapshot issues, not something specific to dates.\r\n\r\nSeparate from that, we can perhaps leave this issue to discuss if we want the equality to go any deeper. Could users somehow hook into `types.frozen` with a \"comparer\" to avoid generating patches when nothing is changing?"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-09-16", "body": "Yeah I like that. We could maybe even avoid a breaking change here by writing something like that. If we provide custom comparators for certain data types (or all perhaps?) - we could preserve the default behavior as-is, and allow users to opt-in to another behavior.\r\n\r\nI'm going to mark this as an enhancement for now."}], "jev": {"disposition": "feature_new_api", "disp_conf": 0.38, "disp_probs": {"feature_new_api": 0.45, "breaking_change_proposal": 0.23, "runtime_bug": 0.23, "feature_api_neutral": 0.09}, "module": "patches_snapshots", "mod_conf": 0.73, "mod_probs": {"patches_snapshots": 0.74, "refinement_custom_enum": 0.26}, "severity": 1.3, "nouls": {"has_reproduction": 0.95, "proposes_concrete_fix": 0.09, "thread_already_resolved": 0.02, "external_cause": 0.06, "maintainer_declined": 0.08, "blocked_on_info": 0.03, "asks_to_change_documented_behavior": 0.42, "reporter_is_frustrated_or_blocked": 0.05}}}, {"number": 2217, "title": "got \u300cunknown\u300d type when using Instance<typeof SomeModel>", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2217", "created": "2024-10-22", "updated": "2024-10-31", "labels": ["Typescript", "docs or examples"], "author": "JLUiceman", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n-   [x] I've checked documentation and searched for existing issues [and discussions](https://github.com/mobxjs/mobx-state-tree/discussions)\r\n-   [x] I've made sure my project is based on the latest MST version\r\n-   [x] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction.\r\n\r\n**Sandbox link or minimal reproduction code**\r\nI try to get the type of model by using Instance method just like the doc recommended, but the result confused me:\r\n\r\nwhen i define a model like the pic below, it works fine\r\n<img width=\"666\" alt=\"\u622a\u5c4f2024-10-22 15 27 30\" src=\"https://github.com/user-attachments/assets/ecdebc1e-a72b-4302-8a4f-3a845b4f79ca\">\r\n\r\nbut when i define a model in this way, i got a unknown type\r\n<img width=\"687\" alt=\"\u622a\u5c4f2024-10-22 15 22 14\" src=\"https://github.com/user-attachments/assets/a0a96945-1e57-4982-a57f-7827d1a93cf2\">\r\n\r\nIs there anyway i can avoid this or i just missed some key information when reading the doc?", "comments": [{"author": "thegedge", "assoc": "COLLABORATOR", "date": "2024-10-22", "body": "@JLUiceman are you on the latest version? I wasn't able to reproduce :(\r\n\r\n![CleanShot 2024-10-22 at 09 44 39@2x](https://github.com/user-attachments/assets/aa5351ea-fe2f-40f0-9686-2ebaa0981c47)"}, {"author": "kuguarpwnz", "assoc": "NONE", "date": "2024-10-22", "body": "type resolution does not work for me in WebStorm\r\n<img width=\"315\" alt=\"image\" src=\"https://github.com/user-attachments/assets/5b0baa66-2bbb-4e8d-96d1-50b6bb648b24\">\r\n\r\nalthough it works in vs code\r\n<img width=\"548\" alt=\"image\" src=\"https://github.com/user-attachments/assets/3c8dd266-49bb-41f4-a202-17116df4c14c\">"}, {"author": "JLUiceman", "assoc": "NONE", "date": "2024-10-23", "body": "> @JLUiceman are you on the latest version? I wasn't able to reproduce :(\r\n> \r\n> ![CleanShot 2024-10-22 at 09 44 39@2x](https://private-user-images.githubusercontent.com/833576/378865802-aa5351ea-fe2f-40f0-9686-2ebaa0981c47.png?jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbSIsImtleSI6ImtleTUiLCJleHAiOjE3Mjk2NDc4NTAsIm5iZiI6MTcyOTY0NzU1MCwicGF0aCI6Ii84MzM1NzYvMzc4ODY1ODAyLWFhNTM1MWVhLWZlMmYtNDBmMC05Njg2LTJlYmFhMDk4MWM0Ny5wbmc_WC1BbXotQWxnb3JpdGhtPUFXUzQtSE1BQy1TSEEyNTYmWC1BbXotQ3JlZGVudGlhbD1BS0lBVkNPRFlMU0E1M1BRSzRaQSUyRjIwMjQxMDIzJTJGdXMtZWFzdC0xJTJGczMlMkZhd3M0X3JlcXVlc3QmWC1BbXotRGF0ZT0yMDI0MTAyM1QwMTM5MTBaJlgtQW16LUV4cGlyZXM9MzAwJlgtQW16LVNpZ25hdHVyZT0wNWMwMWVlNzQwMTkyOGQxN2Q5NmZlMzQ3ZGM3NGJjMGUwZjVlYWI0NzdiOTdjMmJjMTQ0ZjcyNzA4NDczMmQ3JlgtQW16LVNpZ25lZEhlYWRlcnM9aG9zdCJ9.MaKV3v5rFFdm9oI3--RHbSyal4z8C_d24aeQoXoo2cg)\r\n\r\n@t \u2026"}, {"author": "thegedge", "assoc": "COLLABORATOR", "date": "2024-10-23", "body": "Great question!\r\n\r\nIf I had to guess, it's one of three things:\r\n\r\n1. A language server other than `tsserver` that's behaving differently.\r\n2. The language server not properly loading up tsconfig.\r\n3. Wrong version of typescript is evaluating things inside the language server."}, {"author": "thegedge", "assoc": "COLLABORATOR", "date": "2024-10-23", "body": "That being said, I'll flag this as a perhaps a small docs update where we could have a callout for issues with types when using WebStorm. If you do figure out what the issue is, though, drop a comment here :)"}, {"author": "JLUiceman", "assoc": "NONE", "date": "2024-10-25", "body": "> That being said, I'll flag this as a perhaps a small docs update where we could have a callout for issues with types when using WebStorm. If you do figure out what the issue is, though, drop a comment here :)\r\n\r\nYep, I will also continue to follow up on this issue and try to find out the possible reasons. If there are further conclusions, I will comment here.\r\nThanks for your patient explanation, and hope we can got a solution:)"}, {"author": "jaryway", "assoc": "NONE", "date": "2024-10-31", "body": "![image](https://github.com/user-attachments/assets/9768e63b-5ec2-4b4f-8a8b-8cc91d05f28e)\r\n![image](https://github.com/user-attachments/assets/d78a48bb-77af-4ad5-8ac8-b1055002c342)\r\n![image](https://github.com/user-attachments/assets/b397c8bf-ada1-4125-9225-c5c549a14f45)"}], "jev": {"disposition": "typescript_defect", "disp_conf": 0.37, "disp_probs": {"typescript_defect": 0.44, "docs_only": 0.31, "usage_question": 0.24}, "module": "unknown", "mod_conf": 0.64, "mod_probs": {"unknown": 0.67, "model": 0.19, "docs_site": 0.1}, "severity": 0.8, "nouls": {"has_reproduction": 0.47, "proposes_concrete_fix": 0.03, "thread_already_resolved": 0.07, "external_cause": 0.84, "maintainer_declined": 0.08, "blocked_on_info": 0.13, "asks_to_change_documented_behavior": 0.15, "reporter_is_frustrated_or_blocked": 0.07}}}, {"number": 2227, "title": "Move off TSLint", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2227", "created": "2024-11-27", "updated": "2024-12-01", "labels": ["help/PR welcome", "level: easy"], "author": "coolsoftwaretyler", "body": "We are still using TSLint, which [has been deprecated for five years](https://palantir.github.io/tslint/), so we should update to [typescript-eslint](https://typescript-eslint.io/).", "comments": [{"author": "alyssadicarlo", "assoc": "NONE", "date": "2024-12-01", "body": "I\u2019ve been in touch with Tyler about this issue and would like to take it on. We\u2019ve discussed the plan to wait until the Prettier formatting changes (from [#2226](https://github.com/mobxjs/mobx-state-tree/pull/2226)) are merged before committing anything major, but in the meantime, I\u2019ll begin researching and spiking out the migration from TSLint to [typescript-eslint](https://typescript-eslint.io/)."}], "jev": {"disposition": "infra_chore", "disp_conf": 1, "disp_probs": {"infra_chore": 1}, "module": "build_packaging", "mod_conf": 1, "mod_probs": {"build_packaging": 1}, "severity": 0.0, "nouls": {"has_reproduction": 0.06, "proposes_concrete_fix": 0.09, "thread_already_resolved": 0.02, "external_cause": 0.32, "maintainer_declined": 0.03, "blocked_on_info": 0.02, "asks_to_change_documented_behavior": 0.37, "reporter_is_frustrated_or_blocked": 0.04}}}, {"number": 2232, "title": "Use Changesets", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2232", "created": "2024-12-13", "updated": "2024-12-13", "labels": ["enhancement", "help/PR welcome", "level: easy", "hacktoberfest"], "author": "coolsoftwaretyler", "body": "I was recently introduced to [changesets](https://github.com/changesets/changesets?tab=readme-ov-file) and I love it. If anyone is looking for an easy intro OSS contribution, I would welcome a PR adding that tool to this repository.\r\n\r\nOtherwise, we'll get around to it eventually.", "comments": [], "jev": {"disposition": "infra_chore", "disp_conf": 1, "disp_probs": {"infra_chore": 1}, "module": "build_packaging", "mod_conf": 0.97, "mod_probs": {"build_packaging": 0.98}, "severity": 0.0, "nouls": {"has_reproduction": 0.09, "proposes_concrete_fix": 0.05, "thread_already_resolved": 0.02, "external_cause": 0.31, "maintainer_declined": 0.06, "blocked_on_info": 0.03, "asks_to_change_documented_behavior": 0.12, "reporter_is_frustrated_or_blocked": 0.02}}}, {"number": 2237, "title": "Replacing large array very slow (possibly due to reconciliation)", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2237", "created": "2024-12-30", "updated": "2025-01-04", "labels": ["bug", "help/PR welcome", "level: intermediate"], "author": "yossivainshtein", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\nI have a simple model containing an array of ~10K randomly generated points (points are a very simple model with an `identifier` and a string field).\r\nI'm replacing the array with another similar-sized array of randomly-generated points. (In the real app this would be data coming from the server)\r\n\r\nThe replace itself takes a very, very long time - about 16 seconds on my machine. \r\n\r\nI tried to understand why, I think this is due to the attempts of entity reconciliation in the array. It has 2 nested for loops, resulting in O(n^2) iterations.\r\nI'm not sure why this is needed though, as the entities contain IDs and can be looked up quickly - Is there a reason for this? Am I doing something wrong?\r\n\r\n```\r\nconst Point = types.model(\"Point\").props({\r\n  uuid: types.identifier,\r\n  name: types.string,\r\n});\r\n\r\nconst PointsStore = types\r\n  .model({\r\n    points: types.array(Point),\r\n  })\r\n  .actions((self) => ({\r\n    setPoints(points: Instance<typeof Point>[]): void {\r\n      self.points.replace(points);\r\n    },\r\n  }));\r\nconst store = PointsStore.create({\r\n  points: generateRandomPoints(10000),\r\n});\r\nconst newPoints = generateRandomPoints(10000).map((e) => Point.create(e));\r\n\r\nconst before = new Date();\r\n// store.setPoints([]); // If I include this, replacing is fast\r\nstore.setPoints(newPoints); // <-- This is very slow!\r\n```\r\n\r\nif I insert the line \r\n```store.setPoints([]);```\r\nbefore assigning the new array, there's no performance issue. This is a workaround though, I don't want to always be conscious of this issue when replacing arrays. \r\n\r\n\r\n-   [X] I've checked documentation and searched for existing issues [and discussions](https://github.com/mobxjs/mobx-state-tree/discussions)\r\n-   [X] I've made sure my project is based on the latest MST version\r\n-   [X] Fork [this](https://codesandbox.io/p/sandbox/check-mst-repalce-performance-forked-2jvqwj?workspaceId=ws_UCwiGtoQYRJP5RUk9PpyQL) code sandbox or another minimal reproduction.\r\n\r\n**Sandbox link or minimal reproduction code**\r\nhttps://codesandbox.io/p/sandbox/check-mst-repalce-performance-forked-2jvqwj?workspaceId=ws_UCwiGtoQYRJP5RUk9PpyQL\r\n\r\n\r\n** What should happen? **\r\n`setPoints` should take a reasonable amount of time\r\n** What happens instead? **\r\n`setPoints` is agonizingly slow, takes 16sec on my machine", "comments": [{"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-12-30", "body": "Hey @yossivainshtein - thanks for the bug report!\r\n\r\nI agree that's pretty bad.\r\n\r\nYou wrote this:\r\n\r\n> It has 2 nested for loops, resulting in O(n^2) iterations.\r\n\r\nWhat code are you referring to specifically? I can take a look and see if there's a chance to clean things up.\r\n\r\nI will mark this as a bug and hopefully get around to it in the coming months! Happy to review any PRs that you or other observers write."}, {"author": "yossivainshtein", "assoc": "NONE", "date": "2024-12-31", "body": "Hi @coolsoftwaretyler , Thanks for the quick response!\r\n\r\nI was referring to the function `reconcileArrayChildren` in `ArrayType`.\r\nIt's general structure, is \r\n```\r\nfunction reconcileArrayChildren<TT>(\r\n    parent: AnyObjectNode,\r\n    childType: IType<any, any, TT>,\r\n    oldNodes: AnyNode[],\r\n    newValues: TT[],\r\n    newPaths: (string | number)[]\r\n)\r\n  for (let i = 0; ; i++) {\r\n        const hasNewNode = i <= newValues.length - 1\r\n        const oldNode = oldNodes[i]\r\n        let newValue = hasNewNode ? newValues[i] : undefined\r\n\r\n        if (!oldNode && !hasNewNode) {\r\n            // both are empty, end\r\n            break\r\n        } else if (!hasNewNode) {\r\n            // new one does not exists\r\n            ...\r\n        } else if (!oldNode) {\r\n            // there is no old node, create it\r\n            ...\r\n        } else if (areSame(oldNode, newValue)) {\r\n            // both are the \u2026"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-12-31", "body": "Thanks for the specifics, @yossivainshtein.\r\n\r\nWe have a contributing guide in https://github.com/mobxjs/mobx-state-tree/blob/master/CONTRIBUTING.md that will help you get started.\r\n\r\nHappy to answer any specific questions you have. \r\n\r\nI'm going to assign this issue to you for now. Feel free to drop any dev questions you have in this thread, or send me an email. If you decide not to work on it, please let me know and I'll remove your assignment and we'll add it to the backlog."}, {"author": "k-ode", "assoc": "CONTRIBUTOR", "date": "2025-01-04", "body": "Note that if you change the array to `types.map` the replace call will be very fast, as expected."}], "jev": {"disposition": "performance_or_memory", "disp_conf": 0.99, "disp_probs": {"performance_or_memory": 1}, "module": "array", "mod_conf": 1, "mod_probs": {"array": 1}, "severity": 1.8, "nouls": {"has_reproduction": 0.97, "proposes_concrete_fix": 0.08, "thread_already_resolved": 0.33, "external_cause": 0.06, "maintainer_declined": 0.04, "blocked_on_info": 0.05, "asks_to_change_documented_behavior": 0.24, "reporter_is_frustrated_or_blocked": 0.58}}}, {"number": 2254, "title": "SnapshotIn Type unexpectedly changed behavior in MST version 7 (when upgrading from 6)", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2254", "created": "2025-03-25", "updated": "2025-04-05", "labels": ["Typescript"], "author": "jrmyio", "body": "In MST 6 when you do `SnapshotIn<typeof ParentType>` it always returned a simple type. Since MST 7 any child / sub type inside `ParentType` seem to return their `SnapshotOrInstance` version instead of `SnapshotIn` of the child type. \n\nI would expect SnapshotIn to always expect a simple JSON rather than allow instances to still be part of the Snapshot type.\n\nHere you can see the MST 6 behavior:\nhttps://codesandbox.io/p/sandbox/angry-vaughan-4zcrps\n\nMST 7 behavior:\nhttps://codesandbox.io/p/devbox/mst-6-forked-yx22tx\n\nWhere I think it makes it a mistake in above sandbox:\n`\n    // UNEXPECTED:\n    // getSomething() is valid here?\n`", "comments": [{"author": "thegedge", "assoc": "COLLABORATOR", "date": "2025-03-25", "body": "Curious about that expectation, @jrmyio. Specifically, why don't think you an instance should be acceptable as an input snapshot? I ask because an instance (in most cases) satisfies the interface of an input snapshot.\n\nNote that this choice was intentional. We implemented it in https://github.com/mobxjs/mobx-state-tree/pull/2199, and you can see links to various discussions on that decision, https://github.com/mobxjs/mobx-state-tree/issues/1568#issuecomment-2211830330 in particular."}, {"author": "jrmyio", "assoc": "CONTRIBUTOR", "date": "2025-03-25", "body": "Thanks for your quick reply. I agree it's good to support instances when using `Type.create({})`. I am not sure the type returned by SnapshotIn needs to be the exact same type as the first argument of the create function.\n\nI am not so convinded one should call an object with possible instances in it a `Snapshot`. As far as I know, a `Snapshot` in MST always meant the json-like structure which is different from an `instance`. Functions like `getSnapshot()`, `onSnapshot()`, or types like `SnapshotOut<>` always return this JSON like structure.\n\nImo the MST 6 `SnapshotIn` type behavior made sense for its name.\nThe new SnapshotIn in MST 7 is more like a `CreateType` to me.\n\nThe reason I ran into issues is that I've been using this `SnapshotIn` type as the type that an external API would send to the client, or the type a cache layer would store before sending it to the client. This type is now \u2026"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2025-03-29", "body": "Hey @jrmyio - I'm sorry about the mixup this caused on your end. That's the trouble with breaking changes.\n\nI'm inclined to agree with @thegedge here (we talked about it at length at the time).\n\nI don't think it makes sense to reverse the decision, but I'd be open to a PR to add another type helper, or I'd be curious if you can utilize SnapshotOut here instead?"}, {"author": "thegedge", "assoc": "COLLABORATOR", "date": "2025-03-29", "body": "Alternatively, I may have been able to take a far more sophisticated approach, where I could derive an interface that matches the model instance type, but only has the identifier attribute. So something like:\n\n```ts\nconst MyModel = types.model({\n  myIdentifier: types.identifierNumber,\n  tags: types.array(types.string),\n  description: types.string,\n})\n\n// { myIdentifier: number }\ntype InstanceInput = AsCreationParam<MyModel>;\n```\n\nThe idea would be that we'd have a fairly primitive interface, but `Instance<typeof MyModel>` would actually validate as an `InstanceInput`\n\n[EDIT]\nNope, this probably isn't a wise thing to do, because the `instantiate` method wants a state tree node, so I think the type needs to reflect a statetree node, otherwise we're being incorrect: https://github.com/mobxjs/mobx-state-tree/blob/cb26163cd56c8d834ef31c6abb8b4ea4e7525dbd/src/types/utility-types/reference.ts#L \u2026"}], "jev": {"disposition": "breaking_change_proposal", "disp_conf": 0.29, "disp_probs": {"breaking_change_proposal": 0.36, "typescript_defect": 0.32, "feature_new_api": 0.29}, "module": "unknown", "mod_conf": 0.29, "mod_probs": {"unknown": 0.33, "model": 0.3, "reference": 0.22, "snapshot_processor": 0.1}, "severity": 1.6, "nouls": {"has_reproduction": 0.92, "proposes_concrete_fix": 0.5, "thread_already_resolved": 0.04, "external_cause": 0.06, "maintainer_declined": 0.94, "blocked_on_info": 0.1, "asks_to_change_documented_behavior": 0.87, "reporter_is_frustrated_or_blocked": 0.33}}}]</script>
<script>
const DATA = JSON.parse(document.getElementById("gold-data").textContent);
const DISP = {
  runtime_bug: "Wrong runtime behavior under documented usage",
  typescript_defect: "Runtime fine; types wrong, loose, or never/any/unknown",
  performance_or_memory: "Correct but too slow or memory hungry",
  docs_only: "Behavior correct; docs or examples are the gap",
  usage_question: "How-do-I; the library already supports it",
  feature_api_neutral: "Improvement with no new public API",
  feature_new_api: "New public functions, types, or options",
  breaking_change_proposal: "Would change existing behavior or API",
  infra_chore: "Build, lint, packaging, release, CI",
  other: "None of these fit",
  close_stale: "Nothing actionable remains; close",
  close_already_resolved: "Fixed, superseded, or worked around; close"
};
const MODULES = ["model", "array", "map", "reference", "identifier", "union", "snapshot_processor", "optional_maybe", "late_lazy", "refinement_custom_enum", "actions_flow", "middleware", "patches_snapshots", "tree_operations", "mobx_interop", "node_lifecycle", "type_checker", "react_integration", "build_packaging", "docs_site", "unknown"];
const ASSOC = { MEMBER: "maintainer", COLLABORATOR: "maintainer", OWNER: "maintainer", CONTRIBUTOR: "contributor" };

let idx = 0, labels = {}, db = null, uid = null, saving = false, dirty = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  const parts = String(s || "").split(/```[a-zA-Z0-9_-]*\n?/);
  return parts.map((p, i) => i % 2 ? `<pre>${esc(p)}</pre>` : esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/!\[[^\]]*\]\([^)]*\)/g, "[image]").replace(/&lt;!--[\s\S]*?--&gt;/g, "")).join("");
}

function renderList() {
  $("list").innerHTML = DATA.map((d, i) => `<button type="button" data-i="${i}" class="${labels[d.number] ? "done" : ""}" aria-current="${i === idx}"><span class="chk">✓</span><span class="n num">#${d.number}</span><span class="t">${esc(d.title)}</span></button>`).join("");
  const n = DATA.filter((d) => labels[d.number]).length;
  $("progress-text").textContent = `${n} / ${DATA.length} labeled`;
  $("progress-bar").style.width = (100 * n / DATA.length) + "%";
}
function probs(obj, pick) {
  return `<div class="probs">${Object.entries(obj).map(([k, v]) => `<div class="row"><span class="lbl" title="${esc(k)}"><i style="width:${Math.round(v * 100)}%"></i><span>${k === pick ? "<b>" + esc(k) + "</b>" : esc(k)}</span></span><span class="v num">${v.toFixed(2)}</span></div>`).join("")}</div>`;
}
function renderIssue() {
  const d = DATA[idx], j = d.jev, L = labels[d.number];
  $("issue-head").innerHTML = `<h2><a href="${esc(d.url)}" target="_blank" rel="noopener">#${d.number} ${esc(d.title)}</a></h2>
    <div class="meta"><span>opened ${d.created} by <b>${esc(d.author)}</b></span><span>last activity ${d.updated}</span>${d.labels.map((l) => `<span class="chip">${esc(l)}</span>`).join("")}</div>`;
  const nouls = Object.entries(j.nouls || {}).map(([k, v]) => `<span class="chip">${esc(k.replace(/_/g, " "))} <b class="num">${v.toFixed(2)}</b></span>`).join("");
  $("jev").innerHTML = `<div><h3>Disposition · conf <span class="num">${j.disp_conf.toFixed(2)}</span></h3>${probs(j.disp_probs, j.disposition)}</div>
    <div><h3>Module · conf <span class="num">${j.mod_conf.toFixed(2)}</span></h3>${probs(j.mod_probs, j.module)}</div>
    <div><h3>Severity <span class="num">${j.severity}</span> / 3</h3><div class="nouls">${nouls}</div></div>`;
  const posts = [{ author: d.author, assoc: "", date: d.created, body: d.body, op: true }, ...d.comments];
  const show = (p) => `<div class="post"><div class="by"><b>${esc(p.author)}</b>${p.op ? '<span class="chip">reporter</span>' : ""}${ASSOC[p.assoc] ? `<span class="chip role">${ASSOC[p.assoc]}</span>` : ""}<span>${p.date || ""}</span></div><div class="md">${md(p.body)}</div></div>`;
  const head = posts.slice(0, 4), tail = posts.slice(4);
  $("thread").innerHTML = head.map(show).join("") + (tail.length ? `<button class="more" type="button" id="more">Show ${tail.length} more comments</button><div id="tail" hidden>${tail.map(show).join("")}</div>` : "");
  if (tail.length) $("more").onclick = () => { $("tail").hidden = false; $("more").hidden = true; };
  const cur = L ? L.disposition : null;
  $("disp-opts").innerHTML = Object.entries(DISP).map(([k, v]) => `<button type="button" data-k="${k}" class="${k === j.disposition ? "jev-pick" : ""}" aria-pressed="${k === cur}"><span class="k">${k}</span><span class="d">${v}</span></button>`).join("");
  $("module-select").innerHTML = MODULES.map((m) => `<option value="${m}" ${m === (L ? L.module : j.module) ? "selected" : ""}>${m}${m === j.module ? "  (Jev)" : ""}</option>`).join("");
  $("notes").value = L ? (L.notes || "") : "";
  $("status").textContent = L ? `Saved ${L.labeled_at ? new Date(L.labeled_at).toLocaleString() : ""}` : "";
  $("status").className = "status";
  dirty = false;
  renderList();
  window.scrollTo({ top: 0 });
}
function selected() { const b = $("disp-opts").querySelector('[aria-pressed="true"]'); return b ? b.dataset.k : null; }
function go(i) { idx = (i + DATA.length) % DATA.length; renderIssue(); }
function nextUnlabeled() { for (let k = 1; k <= DATA.length; k++) { const i = (idx + k) % DATA.length; if (!labels[DATA[i].number]) return go(i); } go(idx + 1); }
function renderExport() { $("export").value = JSON.stringify(Object.values(labels).sort((a, b) => a.number - b.number), null, 2); }

async function save() {
  const d = DATA[idx], disp = selected();
  if (!disp) { $("status").textContent = "Pick a disposition first."; $("status").className = "status err"; return; }
  const doc = { number: d.number, title: d.title, disposition: disp, module: $("module-select").value, notes: $("notes").value.trim(), jev_disposition: d.jev.disposition, jev_module: d.jev.module, labeled_at: new Date().toISOString(), labeler: uid };
  labels[d.number] = doc; renderExport();
  if (!db) { $("status").textContent = "Kept on this page only. Copy the JSON below when done."; $("status").className = "status err"; renderList(); return nextUnlabeled(); }
  if (saving) return; saving = true; $("save").disabled = true;
  try { await db.doc("labels/" + d.number).set(doc); $("status").textContent = "Saved"; $("status").className = "status ok"; nextUnlabeled(); }
  catch (e) { $("status").textContent = "Save failed: " + (e && e.code ? e.code : e); $("status").className = "status err"; }
  finally { saving = false; $("save").disabled = false; }
}

$("disp-opts").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (!b) return; for (const x of $("disp-opts").children) x.setAttribute("aria-pressed", String(x === b)); dirty = true; });
$("list").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) go(+b.dataset.i); });
$("save").onclick = save; $("prev").onclick = () => go(idx - 1); $("next").onclick = () => go(idx + 1);
$("notes").addEventListener("input", () => { dirty = true; }); $("module-select").addEventListener("change", () => { dirty = true; });
$("copy").onclick = async () => { try { await navigator.clipboard.writeText($("export").value); $("copy-status").textContent = "Copied"; } catch { $("export").select(); $("copy-status").textContent = "Select and copy manually"; } };
document.addEventListener("keydown", (e) => {
  const t = e.target.tagName;
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); save(); return; }
  if (t === "TEXTAREA" || t === "SELECT" || t === "INPUT") return;
  if (e.key === "ArrowRight") go(idx + 1); if (e.key === "ArrowLeft") go(idx - 1);
});

renderIssue(); renderExport();

(async () => {
  const user = await window.claude?.use?.("user");
  uid = user ? await user.id() : null;
  db = await window.claude?.use?.("db");
  if (!db) { $("banner").textContent = "Saving is unavailable in this view. Your choices stay on this page; copy the JSON at the bottom when you finish."; $("banner").hidden = false; return; }
  db.collection("labels").onSnapshot((snap) => {
    const fresh = {}; snap.docs.forEach((s) => { const x = s.data(); if (x && x.number != null) fresh[x.number] = x; });
    labels = fresh; renderExport();
    if (!dirty) renderIssue(); else renderList();
  }, (err) => { $("banner").textContent = "Live sync stopped (" + err.code + "). Saves may still work; reload to resync."; $("banner").hidden = false; });
})();
</script>
