<title>MST Gold Labels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed issue list on the left, one issue at a time on the right; the label controls sit at the bottom of the issue so the thread is read before the choice is made. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --line: #D9DEE5; --fg: #1B2430; --muted: #5B6778;
  --accent: #0E6B78; --accent-ink: #FFFFFF; --accent-soft: #DCEFF2; --ok: #2B7A4B; --warn: #A86B12; --code-bg: #EEF1F5;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121820; --surface: #1A222C; --line: #2B3542; --fg: #E6EBF1; --muted: #93A1B3;
  --accent: #5FC7D4; --accent-ink: #0B1A1E; --accent-soft: #163239; --ok: #6BCB8B; --warn: #E0A84A; --code-bg: #0E141B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121820; --surface: #1A222C; --line: #2B3542; --fg: #E6EBF1; --muted: #93A1B3;
  --accent: #5FC7D4; --accent-ink: #0B1A1E; --accent-soft: #163239; --ok: #6BCB8B; --warn: #E0A84A; --code-bg: #0E141B; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 48px }
a { color: var(--accent) }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600 }
h1 { font-size: 20px } h2 { font-size: 16px } h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
button { font: inherit; cursor: pointer }
button:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums }

.app { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 24px; align-items: start }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px }
header.top p { margin: 0; color: var(--muted) }
.progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s }
.banner { grid-column: 1 / -1; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 6px; color: var(--fg); background: var(--surface) }

nav.list { position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 24px); overflow: auto; display: flex; flex-direction: column; gap: 2px }
nav.list button { display: grid; grid-template-columns: 20px 52px minmax(0, 1fr); gap: 8px; align-items: baseline; text-align: left; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg) }
nav.list button:hover { background: var(--surface) }
nav.list button[aria-current="true"] { background: var(--accent-soft) }
nav.list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px }
nav.list .chk { color: var(--ok); font-weight: 600; visibility: hidden } nav.list .done .chk { visibility: visible }
nav.list .n { color: var(--muted); font-size: 12px }

main { display: flex; flex-direction: column; gap: 20px; min-width: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0 }
.issue-head { display: flex; flex-direction: column; gap: 6px }
.issue-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted) }
.chip.role { border-color: var(--accent); color: var(--accent) }

.jev { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px }
.probs { display: flex; flex-direction: column; gap: 4px; margin-top: 8px }
.probs .row { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 13px }
.probs .lbl { position: relative; padding: 2px 6px; border-radius: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis }
.probs .lbl > i { position: absolute; inset: 0; background: var(--accent-soft); z-index: 0 } .probs .lbl > span { position: relative; z-index: 1 }
.probs .v { text-align: right; color: var(--muted) }
.nouls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.nouls .chip b { color: var(--fg); font-weight: 500 }

.thread { display: flex; flex-direction: column; gap: 14px }
.post { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line) }
.post:first-child { border-top: 0; padding-top: 0 }
.post .by { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted) }
.post .by b { color: var(--fg); font-weight: 500 }
.md { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px }
.md pre { white-space: pre; overflow-x: auto; background: var(--code-bg); border-radius: 6px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.45; margin: 6px 0 }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 0 4px; border-radius: 3px }
.more { align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 13px }

.label { display: flex; flex-direction: column; gap: 14px; position: sticky; bottom: 0 }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px }
.opts button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; gap: 2px }
.opts button .k { font-weight: 500; font-size: 14px } .opts button .d { font-size: 12px; color: var(--muted); line-height: 1.35 }
.opts button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) } .opts button[aria-pressed="true"] .d { color: var(--accent-ink); opacity: .85 }
.opts button.jev-pick:not([aria-pressed="true"]) { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.field { display: flex; flex-direction: column; gap: 6px } .field label { font-size: 13px; color: var(--muted) }
select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; max-width: 100% }
textarea { min-height: 64px; resize: vertical }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.btn { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 500 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn:disabled { opacity: .5; cursor: default }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em }
.status.ok { color: var(--ok) } .status.err { color: var(--warn) }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px }
details.export summary { cursor: pointer; color: var(--muted); font-size: 13px }
details.export textarea { font-family: var(--mono); font-size: 12px; min-height: 120px; margin-top: 8px }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted) }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  nav.list { position: static; max-height: none; flex-direction: row; overflow-x: auto; padding-bottom: 6px }
  nav.list button { width: auto; grid-template-columns: auto auto; flex: 0 0 auto } nav.list .t { display: none }
  .label { position: static }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none } }
</style>

<div class="app">
  <header class="top">
    <h1>MST Gold Labels</h1>
    <p>26 open issues from mobx-state-tree, classified by Jev v2. Choose the label you would give as maintainer. Jev's pick is marked with a left bar; agree or override.</p>
  </header>
  <div class="progress"><span class="num" id="progress-text">0 / 26 labeled</span><div class="bar"><i id="progress-bar"></i></div></div>
  <div class="banner" id="banner" hidden></div>

  <nav class="list" id="list" aria-label="Issues"></nav>

  <main>
    <section class="card issue-head" id="issue-head"></section>
    <section class="card">
      <h3>Jev's read</h3>
      <div class="jev" id="jev"></div>
    </section>
    <section class="card">
      <h3>Thread</h3>
      <div class="thread" id="thread"></div>
    </section>
    <section class="card label" id="label">
      <h2>Your label</h2>
      <div class="opts" id="disp-opts" role="group" aria-label="Disposition"></div>
      <div class="row2">
        <div class="field"><label for="module-select">Code area most at fault</label><select id="module-select"></select></div>
        <div class="field"><label for="notes">Notes for Claude, optional</label><textarea id="notes" placeholder="Why, or what the fix should be"></textarea></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="save">Save and next</button>
        <button class="btn" id="prev">Previous</button>
        <button class="btn" id="next">Skip</button>
        <span class="status" id="status"></span>
        <span class="status"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>⌘</kbd><kbd>↵</kbd> save</span>
      </div>
      <details class="export"><summary>All labels as JSON, in case saving is unavailable</summary><textarea id="export" readonly></textarea><div class="actions" style="margin-top:8px"><button class="btn" id="copy">Copy JSON</button><span class="status" id="copy-status"></span></div></details>
    </section>
  </main>
</div>

<script type="application/json" id="gold-data">[{"number": 381, "title": "Add types.set", "url": "https://github.com/mobxjs/mobx-state-tree/issues/381", "created": "2017-09-13", "updated": "2021-12-15", "labels": ["enhancement", "help/PR welcome"], "author": "the-noob", "body": "I have a few stores where I need a reference to be unique (i.e. `tags` for a product)\r\n\r\nSince every mutation has to go through an action it can be catered for there.\r\n```JavaScript\r\n  function addTag(entity) {\r\n    if (!self.tags.has(entity.id)) {\r\n      self.tags.put(entity);\r\n    }\r\n\r\n    return self.tag.get(entity.id);\r\n  }\r\n```\r\nIt would be nice to have `types.set` with only `tags.add` :)", "comments": [{"author": "stgolem", "assoc": "NONE", "date": "2017-09-14", "body": "This is another reason to have ability to create custom types for MST. \r\nHere all we have is `private Map` and public api to interact with it.\r\nIt would be nice to make it possible to create such Type as it is done inside MST with Maps, Arrays or in some ligther way.\r\n\r\nImagine this as a prototype code:\r\n\r\n```js\r\nconst setType = types.userType(\"Set\")\r\n    .basedOn(types.model)\r\n    .privateProps(baseType => {\r\n        map: types.map(baseType)\r\n    })\r\n    .actions(self => {\r\n        return {\r\n            function add(entity) {\r\n                 if (!self.map.has(entity.id)) {\r\n                      self.map.put(entity);\r\n                  }\r\n                  return self.map.get(entity.id);\r\n            }\r\n        };\r\n    });\r\n```\r\n\r\nThis is totally possible to do with simple `types.model`, but the concept is more generic and allows us to create extension types for MST and easy reuse the \u2026"}, {"author": "Idered", "assoc": "NONE", "date": "2018-03-14", "body": "Is this issue open for PR? I can try to implement `types.set`."}, {"author": "\u2026", "assoc": "", "date": "", "body": "[5 comments omitted]"}, {"author": "mweststrate", "assoc": "MEMBER", "date": "2020-02-21", "body": "\"help/PR welcome\""}, {"author": "kresli", "assoc": "NONE", "date": "2020-04-24", "body": "What should the patches' path reference to?\r\n\r\n```\r\n{\r\n  op: \"add\",\r\n  path: '', // what should be in path?\r\n  value: { title: 'my-title' },\r\n  oldValue: undefined\r\n}\r\n\r\n{\r\n  op: \"remove\",\r\n  path: '' // what should be in path?,\r\n  oldValue: {title: 'my-title'}\r\n}\r\n```\r\nEDIT:\r\nI think its obvious to use root path `path: \"/\"`\r\n\r\nBut then how we would process the remove patch? There is no key or index to track. Any suggestions @mweststrate ?"}, {"author": "mweststrate", "assoc": "MEMBER", "date": "2020-05-07", "body": "I think the path should only be the path to the set itself, not a specific child, so for a top level set, i'd expect it to be empty indeed. I think immer might be a good reference point, iirc it always replaces the full contents on the parent position, rather than having a removal / add operators."}, {"author": "Yamo93", "assoc": "CONTRIBUTOR", "date": "2021-12-15", "body": "Why is this missing in MST? Sets are a quite common data structure."}], "jev": {"disposition": "feature_new_api", "disp_conf": 1, "disp_probs": {"feature_new_api": 1}, "module": "map", "mod_conf": 0.81, "mod_probs": {"map": 0.82, "patches_snapshots": 0.06}, "severity": 1.1, "nouls": {"has_reproduction": 0.54, "proposes_concrete_fix": 0.71, "thread_already_resolved": 0.04, "external_cause": 0.21, "maintainer_declined": 0.09, "blocked_on_info": 0.06, "asks_to_change_documented_behavior": 0.27, "reporter_is_frustrated_or_blocked": 0.15}}}, {"number": 734, "title": "improve error message on snapshot-model discrepancies", "url": "https://github.com/mobxjs/mobx-state-tree/issues/734", "created": "2018-03-26", "updated": "2020-04-03", "labels": ["enhancement", "help/PR welcome"], "author": "jayarjo", "body": "When checking a snapshot for compliance to the root model (in case of failure) `typecheck` dumps out the whole snapshot and the whole type tree, making it nearly impossible to visually locate discrepancy. Could it output only the point of discrepancy between snapshot and model instead? Or at least output it at a separate line?", "comments": [{"author": "Bnaya", "assoc": "MEMBER", "date": "2018-03-30", "body": "I have the same pain point.\r\nMy local workaround, when big arrays are involved, is to catch the error from `create` and then run create call separately for each array item separately. that way it will throw again, but with granular error"}, {"author": "maxgallo", "assoc": "CONTRIBUTOR", "date": "2018-03-31", "body": "Hey @jayarjo, I think what you ask is happening already (or maybe you want more detailed information)\r\nIn the second error in the console log, **the first line of the call stack is the thing**, I suppose, you're looking for.\r\n\r\n<img width=\"902\" alt=\"screen shot 2018-03-31 at 12 32 27\" src=\"https://user-images.githubusercontent.com/3715587/38162801-d4f16a58-34df-11e8-910e-793e988da76d.png\">"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[2 comments omitted]"}, {"author": "mweststrate", "assoc": "MEMBER", "date": "2018-07-12", "body": "Problem is clear, PRs improving this are welcome"}, {"author": "jaythomas", "assoc": "NONE", "date": "2020-02-18", "body": "> Problem is clear, PRs improving this are welcome\r\n\r\nSo the improvement would be to... display the model where the offense is happening versus the entire model that is type-checked? Or how about don't display any data blob and just show the offending properties? Throwing my hat in the ring...\r\n\r\nGiven the model:\r\n\r\n```js\r\nimport { types as t } from 'mobx-state-tree'\r\n\r\nexport default t.model('statement', {\r\n  id: t.string,\r\n  label: t.string,\r\n  transactions: t.array(\r\n    t.model('transaction', {\r\n      id: t.string,\r\n      amount: t.maybeNull(t.number),\r\n      completed_on: t.model('dateSignature', {\r\n        // YYYY-MM-DD\r\n        date: t.refinement('serverDateFormat', t.string, value => {\r\n          return Boolean(value.match(/^[1-9]\\d{3}-[01]\\d-[0123]\\d/))\r\n        })\r\n      })\r\n    })\r\n  )\r\n})\r\n```\r\n\r\nAnd the server data from a network request:\r\n\r\n```js\r\nimport statementModel from \u2026"}, {"author": "mweststrate", "assoc": "MEMBER", "date": "2020-02-18", "body": "Extending Errors objects is perfectly fine. Feel free to PoC something in a\nPR\n\nOp di 18 feb. 2020 04:14 schreef Jay Thomas <notifications@github.com>:\n\n> Problem is clear, PRs improving this are welcome\n>\n> So the improvement would be to... display the model where the offense is\n> happening versus the entire model that is type-checked? Or how about don't\n> display any data blob and just show the offending properties? Throwing my\n> hat in the ring...\n>\n> Given the model:\n>\n> import { types as t } from 'mobx-state-tree'\n> export default t.model('statement', {\n>   id: t.string,\n>   label: t.string,\n>   transactions: t.array(\n>     t.model('transaction', {\n>       id: t.string,\n>       amount: t.maybeNull(t.number),\n>       completed_on: t.model('dateSignature', {\n>         // YYYY-MM-DD\n>         date: t.refinement('serverDateFormat', t.string, value => {\n>           return Boolean(value.m \u2026"}, {"author": "jaythomas", "assoc": "NONE", "date": "2020-04-03", "body": "I had to abandon my work on this project but I just wanted to point out a discovery I made; Large objects which extend the message size to 1MB will be forcibly truncated in Firefox, and Chrome does the same around I think it was 3~4MB(?).\r\n\r\nThis means with the current formatting the relevant \"at path\" information in the message may be truncated out the message."}], "jev": {"disposition": "feature_api_neutral", "disp_conf": 1, "disp_probs": {"feature_api_neutral": 1}, "module": "type_checker", "mod_conf": 1, "mod_probs": {"type_checker": 1}, "severity": 1.4, "nouls": {"has_reproduction": 0.8, "proposes_concrete_fix": 0.49, "external_cause": 0.06, "maintainer_declined": 0.05, "reporter_is_frustrated_or_blocked": 0.38, "thread_already_resolved": 0.03, "blocked_on_info": 0.15, "asks_to_change_documented_behavior": 0.51}}}, {"number": 893, "title": "RFC: Introducing action, computed and view types atoms", "url": "https://github.com/mobxjs/mobx-state-tree/issues/893", "created": "2018-06-21", "updated": "2020-12-18", "labels": ["enhancement", "brainstorming/wild idea"], "author": "mattiamanzati", "body": "Preface: **This PR contains a lot of breaking things I am looking for feedback, please reply if they make sense or not for your needs.**\r\nNot sure if they all make sense for a 3.0 release, but I think they would for a next major version like 4.0\r\n\r\n## Changing from the `IType<S, T>` to `IType<A, O = A, I = O, F = A>`\r\nRight now the `IType` interface accepts two parameters; the runtime type and the snapshot one.\r\n\r\nIf you think about it, that's not completely true. We need more types to represent an MST type. Here's what they should be:\r\n\r\n- `A` is the runtime type; it should be the ObservableArray, observable object, etc...\r\n- `O` is the output type of `getSnapshot(instance)`\r\n- `I` is the input type of `type.create(snapshot)`\r\n- `F` is the type used by the finalizer result, `type.finalizer((self: A) => F)`, we will talk about it more later.\r\n\r\n## Introducing `action`, `computed` and `view` types\r\n\r\nOne of the recurring isses in MST usage with TS is the typing of \"self\" when defining actions / views. \r\n\r\n```typescript\r\nconst Example = types\r\n    .model({\r\n        prop: types.string\r\n    })\r\n    .views(_self => {\r\n        const self = _self as IExample;\r\n        return {\r\n            get upperProp(): string {\r\n                return self.prop.toUpperCase();\r\n            },\r\n            get twiceUpperProp(): string {\r\n                return self.upperProp + self.upperProp;\r\n            }\r\n        };\r\n\r\n    });\r\n\r\ntype ExampleType = typeof Example.Type;\r\ninterface IExample extends ExampleType {}\r\n```\r\n\r\nAt the moment MST requires that they should be declared in a predefined order to make them correctly work. There are also issues when views/action may call each other recursively.\r\n\r\nA really nice way to solve this is to include action and view types in props definition, and later require them to have an actual implementation.\r\n\r\n```typescript\r\nconst Example = types.object({\r\n  prop: types.string,\r\n  upperProp: types.computed(types.string),\r\n  twiceUpperProp: types.computed(types.string)\r\n}).finalize(self => ({\r\n  upperProp: () => self.prop.toUpperCase(),\r\n  twiceUpperProp: () => self.upperProp + self.upperProp\r\n}))\r\n```\r\n\r\nAs you can see now actions can depend on each other, and be used in code even if not declared yet.\r\nBut how should I declare the computed/view/action declaration now? That's what finalizer do!\r\n\r\nFinalizers are functions that are called upon instance contstruction and may return data to improve/finalized the instance based on how the type is declared.\r\nFor example, the object type `P` accepts as finalizer a `Partial<P>`, and the object type will squash that partial into the object instance once created (exaclty how happens with action and views).\r\nIn the same way, the computed type (of string) accepts as finalizer value a function returning a value (of string).\r\nThe action/view/computed has an Input and Output type of `never` that means that cannot be restored from snapshot, and the object type will automatically remove those properties, as valuewise it is not possible to have a property with \"never\" as value.\r\n\r\nBelow at the end of the issue there is a working typelevel implementation of the new types.\r\n\r\nOnce https://github.com/Microsoft/TypeScript/pull/24897#issue-194165511 will be merged in next major, \r\nwe will be able to convert the type of the argument of the below example from a tuple to a function with that exact tuple as input args.\r\n\r\n\r\n## Lazily wrap actions\r\nSince actions are now indipendent atoms, we can la \u2026", "comments": [{"author": "mweststrate", "assoc": "MEMBER", "date": "2018-06-21", "body": "@mattiamanzati interesting ideas! Did you see #774 btw :) it already separates construction snapshot type and normal snapshot type"}, {"author": "k-g-a", "assoc": "MEMBER", "date": "2018-06-22", "body": "@mattiamanzati sounds nice. I have two questions:\r\n1) Will those type declarations on model be optional to use? \r\nThe thing I'm afraid of is that amount of code to be written by end-users will increase. Moreover describing same thing twice (as type & as implementation) in different places makes changes/refactoring harder (e.g. renaming a computed, or changing signature of an action).\r\n2) Does `finalize` mean to substitute `actions`/`views`/`volatile`/`extend`?"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[2 comments omitted]"}, {"author": "mattiamanzati", "assoc": "CONTRIBUTOR", "date": "2018-07-26", "body": "Ideally the old API can be easily polyfilled to be mapped to the new one;\r\nalso this should be done in a major release, and as we did from 0.9 to 0.10 I can provide a codemod too :)"}, {"author": "mattiamanzati", "assoc": "CONTRIBUTOR", "date": "2018-07-26", "body": "We can call the new type \"object\" or \"interface\" as it is an interface that contains methods :)"}, {"author": "pvpshoot", "assoc": "NONE", "date": "2019-03-19", "body": "any updates here?"}, {"author": "mario-jerkovic", "assoc": "NONE", "date": "2020-03-17", "body": "any update?"}], "jev": {"disposition": "breaking_change_proposal", "disp_conf": 1, "disp_probs": {"breaking_change_proposal": 1}, "module": "model", "mod_conf": 0.97, "mod_probs": {"model": 0.98}, "severity": 1.1, "nouls": {"has_reproduction": 0.63, "proposes_concrete_fix": 0.76, "thread_already_resolved": 0.02, "external_cause": 0.06, "maintainer_declined": 0.08, "blocked_on_info": 0.08, "asks_to_change_documented_behavior": 0.78, "reporter_is_frustrated_or_blocked": 0.06}}}, {"number": 1050, "title": "Hide warnings", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1050", "created": "2018-10-17", "updated": "2022-11-09", "labels": ["enhancement", "help/PR welcome"], "author": "olehreznichenko", "body": "I have:\r\n\r\n* [x] Feature request\r\n* [x] I've checked documentation and searched for existing issues\r\n\r\nLets add in to configuration some prop for hide warnings such this\r\n```javascript\r\n[mobx-state-tree] Warning: Attaching onAction listeners to non root nodes is dangerous: No events will be emitted for actions initiated higher up in the tree.\r\n``` \r\nlike did styled-components https://github.com/styled-components/styled-components/commit/86fac6af698b62965c2649a30d81e46d92c7373e\r\nWith hmr i have a lot of warnings", "comments": [{"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2018-10-17", "body": "Could you share an example of the logs you get when using HMR?"}, {"author": "olehreznichenko", "assoc": "NONE", "date": "2018-10-17", "body": "The example in the description of propose, have only onAction warnings"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[4 comments omitted]"}, {"author": "rbuels", "assoc": "NONE", "date": "2019-09-11", "body": "Why is a warning needed in this case in the first place? It seems obvious to me that an onAction listener will only emit for the subtree it's attached to."}, {"author": "beepsoft", "assoc": "NONE", "date": "2022-02-04", "body": "I agree with @rbuels, this warning doesn't really makes sense, since I am aware that it will be applied to to subtree where I am using it. Why is it dangerous in this case?"}, {"author": "Gowtham2003", "assoc": "NONE", "date": "2022-06-12", "body": "any solution for this ? \r\nis there a alternate way to listen to subtree ?"}, {"author": "s-pace", "assoc": "NONE", "date": "2022-11-09", "body": "This is also something we would like to disable when it is purposely implemented"}], "jev": {"disposition": "feature_new_api", "disp_conf": 0.45, "disp_probs": {"feature_new_api": 0.51, "feature_api_neutral": 0.49}, "module": "actions_flow", "mod_conf": 0.92, "mod_probs": {"actions_flow": 0.93, "node_lifecycle": 0.06}, "severity": 0.6, "nouls": {"has_reproduction": 0.09, "proposes_concrete_fix": 0.29, "thread_already_resolved": 0.03, "external_cause": 0.41, "maintainer_declined": 0.07, "blocked_on_info": 0.09, "asks_to_change_documented_behavior": 0.67, "reporter_is_frustrated_or_blocked": 0.14}}}, {"number": 1157, "title": "Functions that create circular references need to have their return type explicitly typed", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1157", "created": "2019-01-29", "updated": "2024-07-14", "labels": ["bug", "Typescript", "docs or examples", "can't fix"], "author": "Amareis", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n* [X] I've checked documentation and searched for existing issues\r\n* [ ] I've made sure my project is based on the latest MST version\r\n**I cannot updates to latest version because of this bug**\r\n* [X] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction. \r\n\r\n**Sandbox link or minimal reproduction code**\r\nhttps://codesandbox.io/s/mj33l002zp\r\n\r\n**Describe the expected behavior**\r\n`chats` view of `User` model should have `Chat[]` return type, as in sandbox.\r\n\r\n**Describe the observed behavior**\r\nAfter updating mobx-state-tree version to 3.8.0 and later, `chats` view on `User` model will have implicit `any` return type. I think it's because of #1074 and that's really annoying bug, whick blocks updating to newest versions.", "comments": [{"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2019-01-29", "body": "```\r\n get chats() { // <-- [ts] 'chats' implicitly has return type 'any' because it does not have a return type annotation and is referenced directly or indirectly in one of its return expressions. [7023]\r\n            return store.chats.filter(\r\n                chat => !!chat.users.find(u => u.id === self.id),\r\n            )\r\n        },\r\n```\r\n\r\nif you add a type annotation to it\r\n```\r\nget chats(): Instance<typeof Chat>[] `\r\n```\r\nit works\r\n\r\nBasically typescript is complaining that it cannot infer the type due to circular references\r\nstore -> Store -> Store.users -> User -> User.chats -> store.chats -> Chat -> Chat.users -> User -> back to User.chats... etc"}, {"author": "Amareis", "assoc": "NONE", "date": "2019-01-29", "body": "But why it works in 3.7.1 and early?"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[13 comments omitted]"}, {"author": "thegedge", "assoc": "COLLABORATOR", "date": "2024-07-07", "body": "I think we'll likely close this issue as \"won't fix\" \ud83d\ude1e\r\n\r\nIt's challenging to bend TS to our will here because of how inference and checking are done at the same time (see see https://github.com/microsoft/TypeScript/issues/26623 for some light discussion on that). Generally the only way around this is:\r\n\r\n1. Use classes, or\r\n2. explicit return type annotations.\r\n\r\nFor (1), there are a couple of class-y MST implementations floating around, such as https://github.com/charto/classy-mst and https://github.com/gadget-inc/mobx-quick-tree/. Otherwise, your best bet is (2), as has already been discussed in this thread :)"}, {"author": "thegedge", "assoc": "COLLABORATOR", "date": "2024-07-07", "body": "~Actually, scrap that. Although I don't understand why, I think I may have a solution here.~\r\n\r\nNevermind. I wrote an incorrect type that just happened to typecheck \ud83d\ude22"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-07-07", "body": "@thegedge - before we close this out, I think we should consider updating the docs with some of the tips and tricks in this thread, along with what you've just posted. I actually point people here for [this comment in particular](https://github.com/mobxjs/mobx-state-tree/issues/1157#issuecomment-483613638) once in a while. I think once issues get closed, they tend to be harder to discover.\r\n\r\nI'm going to tag this with `docs` and say the thing we need to do is help people find the alternative approaches. \r\n\r\nI'll assign this to myself, but mostly will work off your great wrap up answer here."}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-07-12", "body": "Oh whoops, I don't think that answer works. See: https://codesandbox.io/p/sandbox/circular-typing-example-jf3q73?file=%2Fsrc%2Findex.ts%3A8%2C16\r\n\r\nI have hit this in my own work, and I haven't found a workaround. I think you're right that we're limited by TypeScript here, and class-based implementations might work.\r\n\r\nMy other recommendation for folks trying to use `getParentOfType` is to use it from outside the model definitions. So instead of including it as part of the definition in a view or action of a model, you might be able to use it from the outside of the tree like this:\r\n\r\n```ts\r\nimport { getParentOfType, t } from \"mobx-state-tree\";\r\n\r\nconst Post = t.model({\r\n  text: t.string,\r\n});\r\n\r\nconst Category = t.model({\r\n  title: t.string,\r\n  post: t.array(Post),\r\n});\r\n\r\nconst post = Post.create({ text: \"Hello\" });\r\nconst category = Category.create({\r\n  title: \"Category Title\",\r\n  pos \u2026"}], "jev": {"disposition": "typescript_defect", "disp_conf": 1, "disp_probs": {"typescript_defect": 1}, "module": "model", "mod_conf": 0.4, "mod_probs": {"model": 0.44, "late_lazy": 0.35, "unknown": 0.16}, "severity": 1.6, "nouls": {"has_reproduction": 0.97, "proposes_concrete_fix": 0.39, "thread_already_resolved": 0.12, "external_cause": 0.32, "maintainer_declined": 0.92, "blocked_on_info": 0.06, "asks_to_change_documented_behavior": 0.38, "reporter_is_frustrated_or_blocked": 0.89}}}, {"number": 1276, "title": "Feature request: Partial models", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1276", "created": "2019-05-05", "updated": "2019-08-18", "labels": ["brainstorming/wild idea"], "author": "k-ode", "body": "**_Feature request_**\r\n\r\n**Is your feature request related to a problem? Please describe.**\r\nI miss a built in way to create partial models from existing models in MST. Especially when working with a graphql backend, it's cumbersome to having to define all properties on a model as optional, or create a new model for each fragment used.\r\n\r\n**Describe the solution you'd like**\r\nMaybe something analogous to pick in Typescript? The name could be Pick or Select.\r\n\r\n```ts\r\nimport { types } from 'mobx-state-tree';\r\n\r\nconst User = types\r\n    .model('User', {\r\n        id: types.identifier,\r\n        firstName: types.string,\r\n        lastName: types.string,\r\n        username: types.string,\r\n        adress: types.string,\r\n        phoneNumber: types.string\r\n    })\r\n    .views(self => ({\r\n         get fullName() { return self.firstName + ' ' + self.lastName; }\r\n    })\r\n    .actions(self => ({\r\n         setUsername(username) { self.username = username; }\r\n    }));\r\n\r\ntype PartialUser = Pick<User, 'id' | 'name' | 'adress' | 'setUsername'>\r\n\r\nconst PartialUser = User.pick('id', 'name', 'adress', 'setUsername');\r\n```\r\n\r\nOr something closer to extend:\r\n\r\n```js\r\nconst UserPartial = User.select(self => {\r\n    return {\r\n        props: {\r\n           id: self.id,\r\n           username: self.username\r\n        },\r\n        actions: {\r\n           setUserName: self.setUsername\r\n       }\r\n    }\r\n})\r\n```\r\n\r\n**Describe alternatives you've considered**\r\nEither wrap all properties in `types.maybe` or factory functions. Neither are particularly great.\r\n\r\n**Are you willing to (attempt) a PR?**\r\nSure, but looking at the code, I don't think I understand Typescript sufficiently to attempt one.", "comments": [{"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2019-05-08", "body": "Another option (if you know what you are going to pick beforehand) is making the partials and then using types.compose to make the full one\r\n```ts\r\nconst BasicUser = types.model({\r\n  // id, name, address, maybe some actions, views...\r\n})\r\nconst UserDetails = types.model({\r\n  // whatever else\r\n})\r\n\r\nconst FullUser = types.compose(BasicUser, UserDetails);\r\n\r\n// you might even create a type that can be either a basic or a full user\r\nconst User = types.union(FullUser, BasicUser);\r\n```"}, {"author": "k-ode", "assoc": "CONTRIBUTOR", "date": "2019-05-09", "body": "Thanks, that works well for simple cases. As you start using the model in more places though, it can quickly become unwieldy. \r\n\r\n```js\r\nconst UserInComments = types.model({...})\r\n\r\nconst UserInChat = types.model({...})\r\n\r\nconst UserInMobileChat = types.model({...})\r\n\r\nconst UserDetails = types.model({...})\r\n\r\nconst UserInInvoiceList = types.model({...})\r\n\r\nand so on\r\n```"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[6 comments omitted]"}, {"author": "k-ode", "assoc": "CONTRIBUTOR", "date": "2019-05-13", "body": "@Bnaya Thanks for the pointers!\r\n\r\nIf we separate actions and views into standalone functions, we can get pretty close.\r\n\r\n```js\r\nconst props = {\r\n  message: types.string,\r\n  changedDate: types.maybeNull(types.Date),\r\n  createdDate: types.Date,\r\n  id: types.identifier\r\n};\r\n\r\n// actions\r\nconst setMessage = self => message => {\r\n  self.message = message;\r\n};\r\n\r\n// computeds (getters)\r\nconst messageAndChangedDate = self => {\r\n  return self.message + self.changedDate;\r\n};\r\n\r\nconst modelCreator = createModelCreator(\r\n  props,\r\n  {},\r\n  { messageAndChangedDate },\r\n  { setMessage }\r\n);\r\nconst FullModel = modelCreator(\"Comment\");\r\nconst PartialModel = modelCreator(\"CommentPartial\", [\r\n  \"id\",\r\n  \"message\",\r\n  \"changedDate\",\r\n  \"messageAndChangedDate\"\r\n]);\r\nconst partial = PartialModel.create({ message: \"Hello\", id: \"DAgadgJ\", changedDate: new Date() });\r\nconsole.log(partial.setMessage); // undef \u2026"}, {"author": "Bnaya", "assoc": "MEMBER", "date": "2019-05-13", "body": "Once you have a model in hand, you won't have any performance differences on runtime.\r\nBut typescript lang engine dose work harder"}, {"author": "Bnaya", "assoc": "MEMBER", "date": "2019-05-15", "body": "https://github.com/mobxjs/mst-gql/blob/master/README.md :)"}, {"author": "nosachamos", "assoc": "NONE", "date": "2019-08-18", "body": "This would be very useful right about now. I got a situation where I may have models with many properties (Generated at runtime), and want to implement one at a time. It would great if I could send these as partial snapshots, so that those I submit would be updated in the model and the remaining keys would stay unchanged."}], "jev": {"disposition": "feature_new_api", "disp_conf": 1, "disp_probs": {"feature_new_api": 1}, "module": "model", "mod_conf": 0.96, "mod_probs": {"model": 0.97}, "severity": 1.7, "nouls": {"has_reproduction": 0.75, "proposes_concrete_fix": 0.87, "thread_already_resolved": 0.05, "external_cause": 0.18, "maintainer_declined": 0.29, "blocked_on_info": 0.1, "asks_to_change_documented_behavior": 0.25, "reporter_is_frustrated_or_blocked": 0.22}}}, {"number": 1291, "title": "safeReference causes \"Computed values are not allowed to cause side effects\" error", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1291", "created": "2019-05-18", "updated": "2019-05-29", "labels": ["bug"], "author": "terrysahaidak", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I've made sure my project is based on the latest MST version\r\n* [x] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction. \r\n\r\n**Sandbox link or minimal reproduction code**\r\n<!-- link to your sandbox or alternatively minimal reproduction code-->\r\nhttps://codesandbox.io/s/mst-safereference-with-computed-bug-7qizx\r\n\r\n**Describe the expected behavior**\r\n<!-- What should happen? -->\r\nI'm building a pretty complex application with a lot of models and computed properties (minimal example of usage in codesandbox). Some of the models require `safeReference` to be used. But it doesn't work.\r\n\r\nCurrently, as a workaround, I'm using raw value of `rootStore.list` instead of  `rootStore.list.asArray` workaround for arrays (not sure if I still need it, do I?), but even if there is no need for `asArray` for arrays I'm not sure it won't break someday in another way while using several nested views.\r\n\r\n**Describe the observed behavior**\r\n<!-- What happens instead? -->\r\nWhen I've tried to use several nested computed (views) with `safeReference` in one of my models, got an error (see codesandbox for details):\r\n```\r\nError: [mobx] Computed values are not allowed to cause side effects by changing observables that are already being observed. Tried to modify: ObservableObject@631.sender\r\n```", "comments": [{"author": "terrysahaidak", "assoc": "NONE", "date": "2019-05-19", "body": "I've played with it and got a version where I haven't used `safeReference` but it still showed me the same error, so maybe it's not really related. Can't reproduce it again though."}, {"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2019-05-20", "body": "The issue seems to be related to lazy initialization.\r\nslice() in theory shouldn't do any changes in the model, but actually it is accessing all the items in the list and therefore lazy initializing them, and since it is done inside a getter it throws that.\r\n\r\nThat being said it should be an exception to that error, therefore I think it's a bug"}, {"author": "terrysahaidak", "assoc": "NONE", "date": "2019-05-29", "body": "My workaround for this is:\r\n```js\r\nexport function safeReference(T) {\r\n  return t.reference(T, {\r\n    get(identifier, parent) {\r\n      return resolveIdentifier(T, parent, identifier);\r\n    },\r\n    set(value) {\r\n      return value;\r\n    },\r\n  });\r\n}\r\n```\r\n\r\nIt simply returns undefined for unresolved references."}], "jev": {"disposition": "runtime_bug", "disp_conf": 1, "disp_probs": {"runtime_bug": 1}, "module": "reference", "mod_conf": 0.66, "mod_probs": {"reference": 0.69, "mobx_interop": 0.24, "array": 0.05}, "severity": 1.7, "nouls": {"maintainer_declined": 0.05, "reporter_is_frustrated_or_blocked": 0.26, "has_reproduction": 0.91, "thread_already_resolved": 0.86, "blocked_on_info": 0.05, "asks_to_change_documented_behavior": 0.12, "proposes_concrete_fix": 0.88, "external_cause": 0.38}}}, {"number": 1306, "title": "How to describe model with dynamic keys", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1306", "created": "2019-06-03", "updated": "2020-09-12", "labels": ["question", "stale"], "author": "chunkey711", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n**_Question_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I tried the [spectrum channel](https://spectrum.chat/?t=dad48299-3dfc-4e10-b6da-9af1e39498a3)\r\n\r\n<!-- Write your question below -->\r\n\r\nHello, I have some problems with describing the dynamic object model. \r\n\r\n```\r\n someObject: {\r\n \r\n  [id]: {\r\n   collection: {...},\r\n   meta: {...}\r\n },\r\n \r\n  [id]: {\r\n   collection: {...},\r\n   meta: {...}\r\n  }\r\n...\r\n }\r\n```\r\n\r\nI've achieved almost the working model, but it ignore types description, and could receive any type of data. So I think, that i did something wrong.", "comments": [{"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2019-06-05", "body": "```\r\nconst SomeObject = types.map(types.model({\r\n  collection: types.whatever,\r\n  meta: types.whatever,\r\n}))\r\n```"}, {"author": "stale", "assoc": "NONE", "date": "2019-06-15", "body": "This issue has been automatically marked as stale because it has not had recent activity in the last 10 days. It will be closed in 4 days if no further activity occurs. Thank you for your contributions."}, {"author": "\u2026", "assoc": "", "date": "", "body": "[2 comments omitted]"}, {"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2020-09-12", "body": "Or the second idea in a more generic way:\r\n```ts\r\n// generic function\r\nfunction enumAsProps<TEnum extends string, P>(\r\n  enm: Record<any, TEnum>,\r\n  p: P\r\n): {\r\n  [k in TEnum]: P\r\n} {\r\n  const props: any = {}\r\n  for (const key of Object.values(enm)) {\r\n    props[key as PropertyKey] = p\r\n  }\r\n  return props\r\n}\r\n\r\nenum Keys {\r\n  A = \"a\",\r\n  B = \"b\"\r\n}\r\n\r\n@model(\"EM\")\r\nexport class EM extends Model({\r\n  ...enumAsProps(Keys, prop<string>()),\r\n}) {}\r\n\r\nconst em = new EM({\r\n  [Keys.A]: \"hi\",\r\n  [Keys.B]: \"bye\",\r\n})\r\n```"}, {"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2020-09-12", "body": "Sorry, I just realized this issue was for mobx state tree instead of mobx keystone \ud83d\ude05"}, {"author": "JuanJo4", "assoc": "CONTRIBUTOR", "date": "2020-09-12", "body": "yeah, I meant this:\r\n\r\n```\r\ninterface PageInfo {\r\n  title: string;\r\n}\r\n\r\ntype Page = \"home\" | \"about\" | \"contact\";\r\n\r\nconst nav: Record<Page, PageInfo> = {\r\n  about: { title: \"about\" },\r\n  contact: { title: \"contact\" },\r\n  home: { title: \"home\" },\r\n};\r\n\r\nconst NavModel = types.model({\r\n  // is there a way that the keys of the map to be only \"home\" | \"about\" | \"contact\"?\r\n  page: types.map(types.model({\r\n    title: types.string,\r\n  }))\r\n})\r\n```"}, {"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2020-09-12", "body": "If you use fixed keys I'd say the easiest is to just use a model instead of a map"}], "jev": {"disposition": "usage_question", "disp_conf": 0.94, "disp_probs": {"usage_question": 0.94, "feature_new_api": 0.05}, "module": "map", "mod_conf": 0.97, "mod_probs": {"map": 0.97}, "severity": 1.1, "nouls": {"has_reproduction": 0.51, "proposes_concrete_fix": 0.6, "thread_already_resolved": 0.07, "external_cause": 0.74, "maintainer_declined": 0.22, "blocked_on_info": 0.09, "asks_to_change_documented_behavior": 0.43, "reporter_is_frustrated_or_blocked": 0.07}}}, {"number": 1317, "title": "applySnapshot does not call preProcessSnapshot when using types.snapshotProcessor", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1317", "created": "2019-06-14", "updated": "2025-03-16", "labels": ["bug", "help/PR welcome", "level: easy", "hacktoberfest"], "author": "khomyakov42", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n* [v] I've checked documentation and searched for existing issues\r\n* [v] I've made sure my project is based on the latest MST version\r\n* [v] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction. \r\n\r\n**Sandbox link or minimal reproduction code**\r\nhttps://codesandbox.io/embed/mobx-state-tree-todolist-1o4pm\r\n\r\n**Describe the expected behavior**\r\napplySnapshot will call preProcessSnapshot and postProcessSnapshot\r\n\r\n**Describe the observed behavior**\r\napplySnapshot called only postProcessSnapshot", "comments": [{"author": "mario-jerkovic", "assoc": "NONE", "date": "2020-01-07", "body": "Any update on this?"}, {"author": "mweststrate", "assoc": "MEMBER", "date": "2020-01-07", "body": "Sorry, didn't have time personally yet to dive into this. But as the label suggests, feel free to chime in :). A PR with unit tests is already helpful."}, {"author": "\u2026", "assoc": "", "date": "", "body": "[5 comments omitted]"}, {"author": "ddavydov", "assoc": "NONE", "date": "2024-06-19", "body": "is there any chance this issue will be fixed?"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2024-06-19", "body": "Hi @ddavydov - I don't have a substantial update for you. We may get around to it, but I don't know the current status of the work. Sorry for not having a very satisfying answer. \r\n\r\nIf you're so inclined, I'd be happy to accept a PR, or help you get set up in the codebase if you want to make an attempt yourself!"}, {"author": "jcready", "assoc": "NONE", "date": "2025-03-16", "body": "Can the docs at least be updated to warn users that this feature is effectively not usable? It seems like the `preProcessSnapshot` should also have its docs updated to state that it is NOT deprecated because it's the only thing that will actually work with `applySnapshot`."}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2025-03-16", "body": "Sure thing @jcready - I'll publish the changes from https://github.com/mobxjs/mobx-state-tree/pull/2251 shortly."}], "jev": {"disposition": "runtime_bug", "disp_conf": 1, "disp_probs": {"runtime_bug": 1}, "module": "snapshot_processor", "mod_conf": 0.86, "mod_probs": {"snapshot_processor": 0.87, "patches_snapshots": 0.07, "model": 0.06}, "severity": 2.0, "nouls": {"has_reproduction": 0.96, "proposes_concrete_fix": 0.68, "thread_already_resolved": 0.13, "external_cause": 0.03, "maintainer_declined": 0.05, "blocked_on_info": 0.12, "asks_to_change_documented_behavior": 0.07, "reporter_is_frustrated_or_blocked": 0.37}}}, {"number": 1364, "title": "Eager and lazy creation of stores", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1364", "created": "2019-08-13", "updated": "2019-09-21", "labels": ["question"], "author": "Maaartinus", "body": "**_Question_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I tried the spectrum channel, but *won't do it ever again, as it's mostly dead,* at least in summer.\r\n\r\n[The original question](https://spectrum.chat/mobx-state-tree/general/eager-and-lazy-creation-of-stores~d8a27adc-3a21-4bfc-8b7c-4ca10893ede9)\r\n\r\n---\r\n\r\nCurrently, I'm having just a few tens of stores and I'm creating them all greedily like\r\n\r\n```\r\nconst StandardStores = types.model({\r\n    userPageStore: UserPageStore,\r\n    orderPageStore: OrderPageStore,\r\n    ...\r\n})\r\n\r\nfunction newStandardStores() {\r\n     const userPageStore = UserPageStore.create({})\r\n     ...\r\n     return new StandardStores.create({userPageStore, ....})\r\n}\r\n\r\nconst RootStore = types.model({\r\n    standardStores: StandardStores,\r\n    someOtherStores: SomeOtherStores,\r\n    ...\r\n})\r\n\r\nfunction newRootStore() {\r\n    ...\r\n}\r\n```\r\n\r\nMy side question is whether I can avoid the repetitions in `newXxxStore`?\r\n\r\nMy main question is how to do a lazy creation easily. I tried\r\n\r\n```\r\nconst StandardStores = types.model({\r\n})\r\n.views(self => ({\r\n    get userPageStore() {\r\n        return UserPageStore.create({})\r\n   },\r\n}))\r\n...\r\n```\r\n\r\nbut then, my `userPageStore` is not a part of the tree and via `getRoot` it gets itself rather than the `rootStore`, which breaks pretty everything.\r\n\r\nI could play with a\r\n\r\n```\r\n userPageStore: types.optional(UserPageStore),\r\n```\r\n\r\nbut dealing with it would be a big pain.\r\n\r\nI could pass the `rootStore` to every lazily created store, but this would make switching between lazy and eager creation of a given store extremely cumbersome.\r\n\r\n## Summary\r\n\r\nI need an access to my root store from any store, no matter whether it's a greedily created part of the tree or something added later (or not at all; I don't care). I don't want to use a global singleton for the root store.", "comments": [{"author": "Bnaya", "assoc": "MEMBER", "date": "2019-08-14", "body": "Why do you want to do lazy creation?\r\nThere are other patterns, that maybe will give you the desired effect."}, {"author": "Maaartinus", "assoc": "NONE", "date": "2019-08-15", "body": "@Bnaya \r\n> Why do you want to do lazy creation?\r\n\r\n- Avoid spending time in initialization. AFAIK MST is a bit slow and there will be tons of pages, each one having its simple store and this may probably add up.\r\n- Avoid spending memory. While every page (before really used) needs just a little, there's no point in wasting it.\r\n- Avoid future problems, I don't know yet about.\r\n\r\n---\r\n\r\n> There are other patterns, that maybe will give you the desired effect.\r\n\r\nCould you give me some examples?\r\n\r\n---\r\n\r\nI may be wrong with my assumptions.... someone having build a huge app eagerly initializing everything and suffering no problems could tell me.\r\n\r\n---\r\n\r\nI could imagine something like\r\n```\r\n.model('myPageStores', {\r\n\tcartPageStore: types.lazy(CartPageStore, {}),\r\n\torderingPageStore: types.lazy(OrderingPageStore, newOrderingPageStore),\r\n        ....\r\n})\r\n```\r\nwith `types.lazy` working just \u2026"}, {"author": "Bnaya", "assoc": "MEMBER", "date": "2019-08-18", "body": "I don't have direct answer for you,\r\nBut what i did (And not for perf reasons), is to have one types.union of the possible pages models,\r\nand to have one activePageModel or so one the app model."}, {"author": "Maaartinus", "assoc": "NONE", "date": "2019-08-24", "body": "@Bnaya That's an interesting idea, but I'd like to keep a page model after switching to another page because of the used filters and sorting and other such stuff. I'm not sure about that, I guess, there'll be users wanting these settings to be reset every time and others wanting them to be persistent across sessions. So I'll probably give your approach a try."}, {"author": "Bnaya", "assoc": "MEMBER", "date": "2019-08-24", "body": "You can save / restore snapshot of the model outside of the tree on onCreate / onDestroy"}], "jev": {"disposition": "usage_question", "disp_conf": 0.84, "disp_probs": {"usage_question": 0.86, "feature_new_api": 0.14}, "module": "node_lifecycle", "mod_conf": 0.66, "mod_probs": {"node_lifecycle": 0.67, "late_lazy": 0.17, "model": 0.11}, "severity": 1.6, "nouls": {"has_reproduction": 0.51, "proposes_concrete_fix": 0.39, "thread_already_resolved": 0.08, "external_cause": 0.63, "maintainer_declined": 0.11, "blocked_on_info": 0.1, "asks_to_change_documented_behavior": 0.31, "reporter_is_frustrated_or_blocked": 0.2}}}, {"number": 1367, "title": "Calling .props on a type that has .preProcessSnapshot doesn't update its snapshot type", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1367", "created": "2019-08-15", "updated": "2019-09-21", "labels": ["Typescript"], "author": "lorefnon", "body": "**_Bug report_**\r\n\r\n* [X] I've checked documentation and searched for existing issues\r\n* [X] I've made sure my project is based on the latest MST version\r\n\r\n**minimal reproduction code**\r\n\r\n```\r\nimport { types as t, IType, IModelType, ReferenceIdentifier, SnapshotIn, SnapshotOut, Instance} from \"mobx-state-tree\";\r\n\r\n// Define one model\r\n\r\nconst T2 = t.model({\r\n    id: t.identifier\r\n});\r\n\r\ninterface IT2 extends Instance<typeof T2> {}\r\n\r\nconst T$1 = t.model({\r\n    id: t.identifier\r\n}).preProcessSnapshot(s => s);\r\n\r\n// Extend the extracted types to add another attribute:\r\n\r\ninterface ITSnapshotIn extends SnapshotIn<typeof T$1> {\r\n    window: ReferenceIdentifier;\r\n}\r\n\r\ninterface ITSnapshotOut extends SnapshotOut<typeof T$1> {\r\n    window: ReferenceIdentifier;\r\n}\r\n\r\ninterface IT extends Instance<typeof T$1> {\r\n    window: IT2;\r\n}\r\n\r\n// Use a proxy interface to improve error messages\r\n\r\ninterface ITRunType extends IType<ITSnapshotIn, ITSnapshotOut, IT> {}\r\n\r\n// Extend T$1 with another attribute\r\n\r\nconst T$2 = T$1.props({\r\n    window: t.late(() => t.reference(T2))\r\n});\r\n\r\n// Final exposed type \r\nexport const T: ITRunType = T$2;\r\n```\r\n\r\n**Describe the expected behavior**\r\n\r\nCode should compile\r\n\r\n**Describe the observed behavior**\r\n\r\nThe last line fails with following error: \r\n\r\n```\r\nType 'IModelType<{ id: ISimpleType<string>; } & { window: IReferenceType<IModelType<{ id: ISimpleType<string>; }, {}, _NotCustomized, _NotCustomized>>; }, {}, ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>>, _NotCustomized>' is not assignable to type 'ITRunType'.\r\n  Types of property 'is' are incompatible.\r\n    Type '(thing: any) => thing is ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>> | (ModelInstanceTypeProps<{ id: ISimpleType<string>; } & { window: IReferenceType<IModelType<{ id: ISimpleType<string>; }, {}, _NotCustomized, _NotCustomized>>; }> & IStateTreeNode<IModelType<{ id: ISimpleType<string>; } & { window: IReferenceType<IModelType<{ id: ISimpleType<string>; }, {}, _NotCustomized, _NotCustomized>>; }, {}, ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>>, _NotCustomized>>)' is not assignable to type '(thing: any) => thing is ITSnapshotIn | (IT & IStateTreeNode<ITRunType>)'.\r\n      Type predicate 'thing is ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>> | (ModelInstanceTypeProps<{ id: ISimpleType<string>; } & { window: IReferenceType<IModelType<{ id: ISimpleType<string>; }, {}, _NotCustomized, _NotCustomized>>; }> & IStateTreeNode<...>)' is not assignable to 'thing is ITSnapshotIn | (IT & IStateTreeNode<ITRunType>)'.\r\n        Type 'ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>> | (ModelInstanceTypeProps<{ id: ISimpleType<string>; } & { window: IReferenceType<IModelType<{ id: ISimpleType<string>; }, {}, _NotCustomized, _NotCustomized>>; }> & IStateTreeNode<IModelType<{ id: ISimpleType<string>; } & { window: IReferenceType<IModelType<{ id: ISimpleType<string>; }, {}, _NotCustomized, _NotCustomized>>; }, {}, ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>>, _NotCustomized>>)' is not assignable to type 'ITSnapshotIn | (IT & IStateTreeNode<ITRunType>)'.\r\n          Type 'ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>>' is not assignable to type 'ITSnapshotIn | (IT & IStateTreeNode<ITRunType>)'.\r\n            Type 'ModelCreationType<ExtractCFromProps<{ id: ISimpleType<string>; }>>' is not assignable to type 'IT & IStateTreeNode<ITRunT \u2026", "comments": [{"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2019-09-21", "body": "That's because once you use preProcessSnapshot you are basically declaring what your custom snapshot in type is. Not sure if that can be fixed, hmm"}], "jev": {"disposition": "typescript_defect", "disp_conf": 1, "disp_probs": {"typescript_defect": 1}, "module": "model", "mod_conf": 0.65, "mod_probs": {"model": 0.67, "snapshot_processor": 0.33}, "severity": 1.3, "nouls": {"has_reproduction": 0.93, "proposes_concrete_fix": 0.03, "thread_already_resolved": 0.05, "external_cause": 0.09, "maintainer_declined": 0.21, "blocked_on_info": 0.03, "asks_to_change_documented_behavior": 0.33, "reporter_is_frustrated_or_blocked": 0.13}}}, {"number": 1369, "title": "getType ignore types.refinement", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1369", "created": "2019-08-16", "updated": "2023-03-01", "labels": ["bug", "enhancement", "help/PR welcome", "level: intermediate"], "author": "swayf", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\nmay be somehow dependent on https://github.com/mobxjs/mobx-state-tree/issues/1114 ?\r\n* [x] I've made sure my project is based on the latest MST version\r\n* [x] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction. \r\n\r\n**Sandbox link or minimal reproduction code**\r\n<!-- link to your sandbox or alternatively minimal reproduction code-->\r\nhttps://codesandbox.io/s/mobx-state-tree-todolist-52jt7\r\n```javascript\r\nimport { types, getType } from \"mobx-state-tree\";\r\n\r\nconst TestType = types.model(\"TestType\", {\r\n  test1: types.number,\r\n  test2: types.number\r\n});\r\n\r\nconst TestType2 = types.refinement(\r\n  \"TestType2\",\r\n  TestType,\r\n  value => value.test1 + value.test2 === 100\r\n);\r\nconst testModel2 = TestType2.create({ test1: 50, test2: 50 });\r\n\r\ntry {\r\n  const testModel2Fail = TestType2.create({ test1: 50, test2: 40 });\r\n} catch (e) {\r\n  console.log(\"OK\");\r\n}\r\n\r\nconst test = getType(testModel2).create({ test1: 50, test2: 40 }); // should fail\r\n\r\n```\r\n\r\n**Describe the expected behavior**\r\n<!-- What should happen? -->\r\nlast expression should fail (or?)\r\n\r\n**Describe the observed behavior**\r\n<!-- What happens instead? -->\r\nbut it does not, because getType returns type before refinement", "comments": [{"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2019-09-21", "body": "That's because upon \".create\", the refinement (validation) is run first, then it will instantiate that node as type \"TestType\", so getType will return that as type for that node.\r\nTo fix this the refinement would need to be kept as type for the node (doable, but not easy)."}, {"author": "xaviergonz", "assoc": "CONTRIBUTOR", "date": "2019-09-21", "body": "Not sure if a bug or an enhancement :)"}, {"author": "eatyourgreens", "assoc": "NONE", "date": "2023-03-01", "body": "We've found that you can use `types.compose` to change the name of the refined model, which doesn't help with dynamically creating new instances but does allow us to reflect on the type of a model created from a snapshot:\r\n```js\r\nconst TestType2 = types.refinement(\r\n  types.compose(\"TestType2\", TestType),\r\n  value => value.test1 + value.test2 === 100\r\n);\r\nconst testModel2 = TestType2.create({ test1: 50, test2: 50 });\r\ngetType(testModel2).name; // 'TestType2'\r\n```\r\n\r\nUsing `types.compose` with just one model feels hacky, but that code does seem to work."}], "jev": {"disposition": "runtime_bug", "disp_conf": 0.28, "disp_probs": {"runtime_bug": 0.36, "feature_api_neutral": 0.27, "feature_new_api": 0.21, "breaking_change_proposal": 0.08, "typescript_defect": 0.06}, "module": "refinement_custom_enum", "mod_conf": 0.94, "mod_probs": {"refinement_custom_enum": 0.95}, "severity": 1.7, "nouls": {"has_reproduction": 0.97, "proposes_concrete_fix": 0.54, "thread_already_resolved": 0.61, "external_cause": 0.05, "maintainer_declined": 0.1, "blocked_on_info": 0.05, "asks_to_change_documented_behavior": 0.57, "reporter_is_frustrated_or_blocked": 0.08}}}, {"number": 1428, "title": "Circular Dependency Issue - TS typings", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1428", "created": "2019-11-27", "updated": "2025-11-21", "labels": ["Typescript"], "author": "oviava", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n**_Question_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I tried the [spectrum channel](https://spectrum.chat/?t=dad48299-3dfc-4e10-b6da-9af1e39498a3)\r\n\r\n<!-- Write your question below -->\r\n\r\nFollowing a lot of hours of research, I ran into this: https://github.com/mobxjs/mst-gql/pull/140. Tested it in my codebase and it's finally a 'sort' of fix for the typings on circular dependencies.\r\n\r\nAre you guys considering including it in MST ?!", "comments": [{"author": "oviava", "assoc": "NONE", "date": "2019-11-27", "body": "Posted this from my phone, I'll update it further when I get home."}, {"author": "oviava", "assoc": "NONE", "date": "2019-11-28", "body": "So coming back to this, for dealing with circular references, an idea - copying most of it from @godness84\r\n\r\n```\r\n\r\nconst MyModel = types.model(\r\n  refExample1: types.reference(types.late((): any => RefExample1)),\r\n  refExample2: types.reference(types.late((): any => RefExample2)),\r\n  refExample3: types.array(types.reference(types.late((): any => RefExample3))),\r\n);\r\n\r\n\r\ntype Without<T, K> = Pick<T, Exclude<keyof T, K>>;\r\n\r\n// this needs better typing\r\ntype ExtendRefs<K> = {\r\n  [P in keyof K]: null extends K[P]\r\n    ? never\r\n    : K[P] extends IArrayType<infer O>\r\n    ? IMSTArray<Instance<IReferenceType<O>>>\r\n    : K[P] extends IAnyComplexType\r\n    ? Instance<IReferenceType<K[P]>>\r\n    : never;\r\n};\r\n\r\ntype WithRefsModelType<T extends IAnyModelType, OTHERS> = Instance<\r\n  T extends IModelType<infer P, infer O, infer C, infer S>\r\n    ? IModelType<Without<P, keyof OTHERS>, O & ExtendRefs<O \u2026"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[5 comments omitted]"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2023-06-30", "body": "Hey @oviava - it's been a while since we heard from you on this MST thread, but I know we're actively looking to improve our TS here. Are you interested in exploring this any more?\r\n\r\nI'm going to put the TS label on this issue for now, and happy to talk about if/when/how to move it forward."}, {"author": "mrgreenh", "assoc": "NONE", "date": "2025-11-21", "body": "I've been battling with this issue myself, especially when it comes to typing self in actions (when I try externalize those to their own file). Has a solution been found to this or is this thread I landed on the state of the art?"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2025-11-21", "body": "Hey @mrgreenh - unfortunately we never made much progress on this. I haven't been able to prioritize it and we haven't had anyone contribute.\n\nSorry for the inconvenience!"}, {"author": "mrgreenh", "assoc": "NONE", "date": "2025-11-21", "body": "No worries, it looks like a really tricky one to fix. Thank you for the quick reply :)"}], "jev": {"disposition": "typescript_defect", "disp_conf": 0.45, "disp_probs": {"typescript_defect": 0.51, "feature_new_api": 0.49}, "module": "late_lazy", "mod_conf": 0.79, "mod_probs": {"late_lazy": 0.81, "reference": 0.14}, "severity": 1.8, "nouls": {"has_reproduction": 0.54, "proposes_concrete_fix": 0.9, "thread_already_resolved": 0.02, "external_cause": 0.18, "maintainer_declined": 0.17, "blocked_on_info": 0.15, "asks_to_change_documented_behavior": 0.31, "reporter_is_frustrated_or_blocked": 0.3}}}, {"number": 1434, "title": "Docs: API docs is all italic after castToSnapshot ", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1434", "created": "2019-12-04", "updated": "2023-06-30", "labels": ["docs or examples"], "author": "SpadarShut", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I've made sure my project is based on the latest MST version\r\n* [ ] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction. \r\n\r\n**Describe the expected behavior**\r\nThe API docs text is all rendered as italic after https://mobx-state-tree.js.org/API/#casttosnapshot castToSnapshot. I guess it's because there's `<I>` in type definition which is considered html and never closed.\r\n\r\n**Describe the observed behavior**\r\nThe text should not be italic, but  normal.", "comments": [{"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2023-06-30", "body": "Great find, @SpadarShut! Sorry that we've still got this open. I think we're going to rework the docs here at MST shortly, but I'll label this as a docs issue for now and close it when relevant. \r\n\r\nThanks!"}], "jev": {"disposition": "docs_only", "disp_conf": 1, "disp_probs": {"docs_only": 1}, "module": "docs_site", "mod_conf": 1, "mod_probs": {"docs_site": 1}, "severity": 0.0, "nouls": {"has_reproduction": 0.2, "proposes_concrete_fix": 0.04, "thread_already_resolved": 0.03, "external_cause": 0.12, "maintainer_declined": 0.06, "blocked_on_info": 0.03, "asks_to_change_documented_behavior": 0.05, "reporter_is_frustrated_or_blocked": 0.04}}}, {"number": 1683, "title": "Memory consumption explodes with large number of nodes. 40MB of data becomes ~16GB in MST", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1683", "created": "2021-04-07", "updated": "2023-10-09", "labels": ["brainstorming/wild idea", "breaking change"], "author": "techknowfile", "body": "**_Bug report_**\r\nMemory consumption explodes with large number of nodes in MST.\r\n2MB of data -> ~600MB in MST\r\n40MB of data -> ~16GB in MST\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I've made sure my project is based on the latest MST version\r\n* [x] Minimal Reproduction \r\n\r\n**Sandbox link or minimal reproduction code**\r\n[Github Repo](https://github.com/techknowfile/mobx-vs-mst)\r\nCodeSandbox fails long before being able to show anything meaningful. Clone repo > yarn install > yarn start\r\n\r\n**Describe the expected behavior**\r\nI'm not sure what the expected overhead of mobx-state-tree is. I've found several posts that mention that mobx-state-tree was never intended to handle hundreds of thousands of nodes, and also see that a couple developers have improved upon the performance for their own use cases. Even still, I'm surprised that 40MB of data could possibly take up 16GB when processed into MST. \r\n\r\n**Describe the observed behavior**\r\nMST able to scale to hold hundreds of thousands of nodes without what appears like a memory leak\r\n\r\nI'll continue to update this bug report with a reproduction of the issue over the next few days, but wanted to get this posted to get the discussion started.", "comments": [{"author": "techknowfile", "assoc": "NONE", "date": "2021-04-22", "body": "Can't seem to really make a codesandbox for this, because codesandbox stops functioning around 10k nodes"}, {"author": "stewartlord", "assoc": "NONE", "date": "2021-04-23", "body": "@techknowfile Does the problem show at 10k nodes, or only when you get into higher numbers? Maybe it's enough to demonstrate the issue with fewer nodes?"}, {"author": "\u2026", "assoc": "", "date": "", "body": "[18 comments omitted]"}, {"author": "eseQ", "assoc": "NONE", "date": "2021-09-23", "body": "> 1. a new branch with complete rewrite and separate release cycle (like mobx@4/mobx@5); provide migration guide; drop current version support and so on...\r\n\r\nIt sounds like best option. For MST-users migration looks like change default `map` and `array` to `mapReference ` and `arrayReference`.\r\n\r\n> the amount of work to be done is quite huge, coupled and spreads over ~60-80% of the codebase\r\nThats really obstruction but it unquestionable importance issue."}, {"author": "BrianHung", "assoc": "CONTRIBUTOR", "date": "2023-06-01", "body": ">   I've [proposed to use special types](https://github.com/mobxjs/mobx-state-tree/issues/1282#issuecomment-515026561) (`types.arrayReference`/`types.mapReference`) - moving to those is a _breaking change_, but will allow us to remove `identifiersCache` completely (which also gives us a chance to [make identifiers mutable](https://github.com/mobxjs/mobx-state-tree/issues/887)).\r\n\r\nIs there some code that I can adapt in user land? Currently creating thousands of nodes, e.g. imagine copying and pasting a spreadsheet, and thinking of performant solutions for this since I keep all nodes in a map with normalized ids."}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2023-06-28", "body": "Hey folks - I don't have enough context here to help move this issue forward, but I _am_ going to tag it, since there's obviously desire and room for some major improvements, but the path forward looks somewhat challenging.\r\n\r\nI don't expect we'll get around to this any time soon, but I do hope we can find a satisfactory path forward in the coming months/year."}, {"author": "ibelehai", "assoc": "NONE", "date": "2023-10-09", "body": "> @weglov I'm currently having to use a hacky solution, where I'm using both pure MobX with a structure that imitates mobx-state-tree and mobx-state-tree itself. Using MobX for the objects that I have 100,000's of, and mst/mst-gql for other parts. I replicated the mst-gql merge function in my MobX root store to be able to parse json responses into the normalized store, and then resolve references that go from MobX objects to mobx-state-tree nodes.\r\n> \r\n> I find that even the 10x increase in footprint when loading into mobx is also a bit excessive, and has me wondering if I should ditch these libraries entirely and roll my own... but I love how they work. And the more I dig into the internals, the more impressed I become.\r\n\r\nHey! I encountered the same issue where I need to combine `mobx` and `mobx-state-tree` in order to increase the performance. I would appreciate if you could share som \u2026"}], "jev": {"disposition": "performance_or_memory", "disp_conf": 0.99, "disp_probs": {"performance_or_memory": 0.99}, "module": "identifier", "mod_conf": 0.92, "mod_probs": {"identifier": 0.93, "reference": 0.07}, "severity": 2.5, "nouls": {"has_reproduction": 0.95, "proposes_concrete_fix": 0.44, "thread_already_resolved": 0.1, "external_cause": 0.15, "maintainer_declined": 0.22, "blocked_on_info": 0.18, "asks_to_change_documented_behavior": 0.31, "reporter_is_frustrated_or_blocked": 0.8}}}, {"number": 1760, "title": "Cast doesn't seem to work in combination with types.references", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1760", "created": "2021-08-13", "updated": "2021-08-13", "labels": ["bug", "help/PR welcome"], "author": "RickLucassen", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I've made sure my project is based on the latest MST version\r\n* [x] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction. \r\n\r\n**Sandbox link or minimal reproduction code**\r\nhttps://codesandbox.io/s/mobx-state-tree-todolist-forked-zcdbg\r\n\r\n**Describe the expected behavior**\r\nI have a function that accepts an instance of a model, when calling this function from within an action on that model and passing `self` as an argument typescript won't accept it. So using cast would make typescript happy again.\r\n\r\n**Describe the observed behavior**\r\nUsing cast doesn't work when the model has a `types.references` present. An error is thrown: \"Two different types with this name exist, but they are unrelated.\"", "comments": [], "jev": {"disposition": "runtime_bug", "disp_conf": 0.44, "disp_probs": {"runtime_bug": 0.5, "typescript_defect": 0.49}, "module": "reference", "mod_conf": 0.58, "mod_probs": {"reference": 0.61, "model": 0.13, "type_checker": 0.12, "snapshot_processor": 0.06}, "severity": 1.8, "nouls": {"has_reproduction": 0.93, "proposes_concrete_fix": 0.04, "thread_already_resolved": 0.03, "external_cause": 0.23, "maintainer_declined": 0.05, "blocked_on_info": 0.05, "asks_to_change_documented_behavior": 0.12, "reporter_is_frustrated_or_blocked": 0.14}}}, {"number": 1912, "title": "Using new Array(n) constructor in snapshot doesn't work", "url": "https://github.com/mobxjs/mobx-state-tree/issues/1912", "created": "2022-05-18", "updated": "2023-06-25", "labels": ["on hold"], "author": "davetapley", "body": "<!-- Not following the template might result in your issue being closed without further notice -->\r\n\r\n**_Bug report_**\r\n\r\n* [x] I've checked documentation and searched for existing issues\r\n* [x] I've made sure my project is based on the latest MST version\r\n* [x] Fork [this](https://codesandbox.io/s/y64pzxj01) code sandbox or another minimal reproduction. \r\n\r\n**Sandbox link or minimal reproduction code**\r\nhttps://codesandbox.io/s/mobx-state-tree-using-new-array-n-constructor-in-snapshot-doesnt-work-ehd5ib\r\n\r\n**Describe the expected behavior**\r\nIf I use `Array.new(3)` for a `types.array(types.maybe(types.number))` it should be `[undefined,undefined,undefined]`.\r\n\r\n**Describe the observed behavior**\r\nIt is put in the store as an empty array `[]`.\r\n\r\n**Even crazier**\r\nIf you `a = Array.new(3); a.fill(undefined)`, then it correctly inserts `[undefined,undefined,undefined]` \ud83e\udd2f", "comments": [{"author": "diegochavez", "assoc": "COLLABORATOR", "date": "2022-05-19", "body": "Hi Dave, \r\n\r\nNew Array generates an array with a length of 3, not including values. that's way is undefined\r\nthe generated array looks like this. \r\n[key]:value\r\n0:undefined\r\n1:undefined\r\n2:undefined\r\n\r\nFor new array from a number you should do,\r\nconst stuff = [...new Array(3).keys()]; \r\nconst stuff = Array.from(new Array(3).keys());"}, {"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2023-06-25", "body": "Hey @davetapley - did the response from @diegochavez solve your problem? If so, let me know and we can close this out. \r\n\r\nSince it's been over a year since there was activity here, I'll probably close this out if I don't hear from any of y'all in the next two weeks or so."}], "jev": {"disposition": "usage_question", "disp_conf": 0.46, "disp_probs": {"usage_question": 0.52, "runtime_bug": 0.45}, "module": "array", "mod_conf": 0.86, "mod_probs": {"array": 0.88, "patches_snapshots": 0.08}, "severity": 1.1, "nouls": {"has_reproduction": 0.96, "proposes_concrete_fix": 0.22, "thread_already_resolved": 0.1, "external_cause": 0.58, "maintainer_declined": 0.21, "blocked_on_info": 0.48, "asks_to_change_documented_behavior": 0.56, "reporter_is_frustrated_or_blocked": 0.1}}}, {"number": 2058, "title": "Document how MST lazily creates objects", "url": "https://github.com/mobxjs/mobx-state-tree/issues/2058", "created": "2023-08-07", "updated": "2023-08-09", "labels": ["docs or examples"], "author": "scytacki", "body": "I think it would be useful to document how MST lazily creates its objects. It is that delay that caused https://github.com/mobxjs/mobx-state-tree/issues/1951, and that delay is why it is possible with https://github.com/mobxjs/mobx-state-tree/pull/1952 for the hooks to be called in different orders depending on how the objects are being referenced. \r\n\r\nIt is kind of a implementation detail (but a big one), so maybe you don't want it in the user facing documentation.\r\n\r\nIf I can find time I'll try make a PR adding documentation for this, but @coolsoftwaretyler and @jamonholmgren do you have opinions about where this documentation should go? It could be in hooks.md but it is kind of more general than that.  It could be a new doc in \"concepts\". Or maybe you'd like to keep it just for developers; in that case I'm not sure where it should go.", "comments": [{"author": "coolsoftwaretyler", "assoc": "COLLABORATOR", "date": "2023-08-09", "body": "Hey @scytacki - thanks for this! I personally would love to have it in the user-facing docs.\r\n\r\nI think it might fit OK in [Advanced Concepts](https://mobx-state-tree.js.org/concepts/patches), but I also think there isn't a great place for it as things stand.\r\n\r\nOne of the things we'll be doing to revitalize things around here is a docs overhaul. So if you were to write this up and drop it wherever, I think we can use that as an input for how we structure new docs.\r\n\r\nThere is no firm plan on where, when, how, etc. of the new docs, but I expect we'll get to it within the calendar year, or just into 2024.\r\n\r\nI'm going to add some labels and assign this issue to you for the sake of keeping things tidy in the issue tracker. If you ever decide you don't want to do this, remove yourself and we can find another contributor to do so."}], "jev": {"disposition": "docs_only", "disp_conf": 1, "disp_probs": {"docs_only": 1}, "module": "node_lifecycle", "mod_conf":
